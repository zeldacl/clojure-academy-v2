tasks.register("verifyNodeLayerDiscipline") {
    group = "verification"
    description = "Mechanical half of the node-layer rule (NODE_LANGUAGE.md section 1): a :layer :composite component must be pure EDN, never a Clojure case-branch/handler. NodeEnvironment normalization rejects implementation functions on composites; this gate covers what normalization alone cannot -- a composite document's own :id literally appearing as a dispatch target inside a domain VM, which would let a composite silently execute as if it were a primitive."
    dependsOn ":node-core:checkClojure"
    doLast {
        def violations = []
        [
            [dir: file("ac/src/main/resources/ac/combat/composites"), vm: file("combat-core/src/main/clojure/cn/li/combat/final_engine.clj")],
            [dir: file("ac/src/main/resources/ac/vfx/composites"), vm: file("vfx-core/src/main/clojure/cn/li/vfx/compiler.clj")]
        ].each { pair ->
            if (pair.dir.directory && pair.vm.file) {
                def vmSourceWithoutComments = pair.vm.text.replaceAll(/(?m);.*$/, "")
                fileTree(pair.dir) { include "*.edn" }.files.each { File doc ->
                    def text = doc.text
                    if (text =~ /:layer\s+:composite/) {
                        // Composite ids are namespaced keywords. Restrict the
                        // scan so payload keys such as `:id :type` do not look
                        // like node dispatch targets.
                        (text =~ /:id\s+(:[A-Za-z0-9!?*\-]+\/[A-Za-z0-9!?*\/-]+)/).each { match ->
                            def id = match[1].toString()
                            // Match a complete keyword token; e.g.
                            // :target/directional-destination must not match
                            // the distinct primitive :target/directional-destination-query.
                            def token = /(?<![A-Za-z0-9!?*\/-])${Pattern.quote(id)}(?![A-Za-z0-9!?*\/-])/ 
                            if (vmSourceWithoutComments =~ token) {
                                violations << "${doc}: :composite component ${id} appears as a literal dispatch target in ${pair.vm} -- composites must only ever be reached through expansion, never a case branch in the domain VM"
                            }
                        }
                    }
                }
            }
        }
        if (!violations.isEmpty()) throw new GradleException(violations.unique().join("\n"))
        logger.lifecycle("[verifyNodeLayerDiscipline] ok")
