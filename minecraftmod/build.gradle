tasks.register("verifyPresentationAtomicSwitch") {
    group = "verification"
    description = "Guard the final Presentation Runtime cut-over and legacy renderer deletion."
    doLast {
        // The repository is now on the Presentation Runtime side of the
        // atomic switch.  A local developer may explicitly disable this gate
        // while inspecting an intermediate worktree, but normal verification
        // must reject any reintroduced legacy seam.
        def enabled = !(findProperty("presentationAtomicSwitch") ?: "true").toString().equalsIgnoreCase("false")
        if (!enabled) {
            logger.lifecycle("[verifyPresentationAtomicSwitch] skipped (-PpresentationAtomicSwitch=false)")
            return
        }
        def roots = [file("ac/src/main/clojure"),
                     file("ac/src/main/resources"),
                     file("mcmod/src/main/clojure"),
                     file("platform-src/platform/shared"),
                     file("platform-src/minecraft"),
                     file("platform-src/loader"),
                     file("presentation-core/src/main"),
                     file("presentation-compiler/src/main")].findAll { it.directory }
        def forbidden = [
            ~/script-render-(runtime|executor|compiler)/,
            ~/script_render_(runtime|executor|compiler|registry)/,
            ~/script-render-registry/,
            ~/level-plan!/,
            ~/render-level-plan!/,
            ~/build-level-plan/,
            ~/build-client-overlay-plan/,
            ~/overlay-plan/,
            ~/draw-plan/,
            ~/kind-renderer/,
            ~/reactive-container-screen/,
            ~/ui-xml\/load-spec/,
            ~/open-reactive-screen!/,
            ~/client-presentation-frame-legacy/,
            ~/build-presentation-frame-legacy/,
            ~/overlay_renderer/,
            ~/overlay-renderer/,
            ~/overlay-elements/,
            ~/build-overlay/,
            ~/active-overlay-app/,
            ~/level_effect_renderer/,
            ~/level-effect-renderer/,
            ~/level_renderer/,
            ~/level-renderer/
        ]
        def offenders = []
        roots.each { root ->
            fileTree(root) {
                include "**/*.clj"
                include "**/*.edn"
                include "**/*.xml"
            }.files.each { source ->
                if (source.name.toLowerCase().endsWith(".xml")) {
                    offenders << "${source}: legacy XML layout source"
                } else {
                    def lines = source.readLines("UTF-8")
                    lines.eachWithIndex { line, index ->
                        if (forbidden.any { pattern -> pattern.matcher(line).find() }) {
                            offenders << "${source}:${index + 1}: ${line.trim()}"
                        }
                    }
                }
            }
        }
        if (!offenders.isEmpty()) {
            throw new GradleException(
                "Presentation atomic switch requested, but legacy UI/render references remain:\n" +
                offenders.take(120).join("\n") +
                (offenders.size() > 120 ? "\n... and ${offenders.size() - 120} more" : ""))
        }
        def legacyJavaRoots = [file("mcmod/src/main/java"),
                               file("platform-src/minecraft"),
                               file("platform-src/loader")].findAll { it.directory }
        def legacyJava = []
        legacyJavaRoots.each { root ->
            fileTree(root) { include "**/*.java" }.files.each { source ->
                def path = source.toString().replace('\\', '/')
                if (path.contains("/mcmod/src/main/java/cn/li/mcmod/ui/") ||
                    path.contains("/mcmod/src/main/java/cn/li/mcmod/uipojo/")) {
                    legacyJava << "${source}: legacy UI Java must be removed before atomic switch"
                }
            }
        }
        if (!legacyJava.isEmpty()) {
            throw new GradleException(
                "Presentation atomic switch requested, but legacy Java UI/render code remains:\n" +
                legacyJava.take(120).join("\n") +
                (legacyJava.size() > 120 ? "\n... and ${legacyJava.size() - 120} more" : ""))
        }
        logger.lifecycle("[verifyPresentationAtomicSwitch] ok (legacy UI/render chain absent)")
    }
}

def targetProviderDescriptors = { target ->
    ((target.providerManifests ?: [:]).values().collectMany { modules -> modules ?: [] })
}

tasks.register("verifyNeutralProviderClosure") {
    group = "verification"
    description = "Verify generated runtime providers resolve only platform-neutral source namespaces."
    doLast {
        def catalog = rootProject.ext.platformCatalog()
        def roots = [file("api/src/main/clojure"), file("mcmod/src/main/clojure"),
                     file("vfx-core/src/main/clojure"), file("combat-core/src/main/clojure"),
                     file("ac/src/main/clojure")]
            .findAll { it.directory }
        def forbidden = java.util.regex.Pattern.compile("(?:net\\.(minecraft|minecraftforge|fabricmc|neoforged)|cn\\.li\\.(mc1201|mc1211|mc262|mcbase|fabric1201|fabric1211|fabric262|fabricbase|forge1201|neoforge1211|neoforge262|neoforgebase))\\.")
        def findSource = { String namespaceName ->
            def rel = namespaceName.replace('.', '/').replace('-', '_') + ".clj"
            roots.collect { new File(it, rel) }.find { it.isFile() }
        }
        def violations = []
        def descriptors = catalog.targets.values().collectMany { target -> targetProviderDescriptors(target) }
        descriptors.each { descriptor ->
            def rootNamespace = descriptor.namespace?.toString()
            if (!rootNamespace) {
                violations << "provider without namespace: ${descriptor}"
                return
            }
            def queue = new ArrayDeque<String>()
            def visited = new LinkedHashSet<String>()
            queue.add(rootNamespace)
            while (!queue.isEmpty()) {
                def namespaceName = queue.removeFirst()
                if (!visited.add(namespaceName)) continue
                def source = findSource(namespaceName)
                if (source == null) {
                    violations << "${descriptor.id}: provider closure namespace is not neutral source: ${namespaceName}"
                    continue
                }
                def text = source.getText("UTF-8")
                // Direct imports and type references are covered globally by
                // verifyNeutralClojureNoMinecraftApis. Here the transitive
                // closure check focuses on static namespace edges and the one
                // source-level escape hatch that can hide a class reference.
                if (text.readLines().any { String line ->
                    line.contains("Class/forName") && forbidden.matcher(line).find()
                }) {
                    violations << "${descriptor.id}: provider closure reflectively names a platform class: ${source}"
                }
                // Require vectors are the only permitted static edge for a
                // neutral provider. Dynamic require remains prohibited by the
                // provider implementation contract and hot-path tests.
                def matcher = java.util.regex.Pattern.compile("\\[\\s*(cn\\.li\\.[A-Za-z0-9_.-]+)").matcher(text)
                while (matcher.find()) {
                    def dependency = matcher.group(1)
                    if (findSource(dependency) != null) queue.add(dependency)
                    if (dependency.startsWith("cn.li.platform.") ||
                        dependency ==~ /cn\.li\.(mc1201|mc1211|mc262|mcbase|fabric1201|fabric1211|fabric262|fabricbase|forge1201|neoforge1211|neoforge262|neoforgebase)(\..*)?/) {
                        violations << "${descriptor.id}: provider closure requires platform namespace ${dependency}"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Neutral provider closure violations:\n" + violations.unique().join("\n"))
        }
        logger.lifecycle("[verifyNeutralProviderClosure] ok ({} provider descriptors)", descriptors.size())
    }
}

tasks.register("verifyNeutralProviderRuntimeLoad", JavaExec) {
    group = "verification"
    description = "Require every neutral provider factory on a classpath without platform sources or Minecraft libraries."
    dependsOn ":api:classes", ":mcmod:classes", ":node-core:classes", ":presentation-core:classes",
              ":presentation-compiler:classes", ":vfx-core:classes", ":combat-core:classes", ":ability-runtime:classes", ":ac:classes"
    // AC's neutral provider closure now owns Presentation Runtime ViewModels;
    // include the shared node/combat/vfx/ability/presentation artifacts in this
    // isolated classpath while still excluding every Minecraft/loader target.
    def neutralProjects = [project(":api"), project(":mcmod"), project(":node-core"), project(":vfx-core"),
                           project(":combat-core"), project(":ability-runtime"),
                           project(":presentation-core"),
                           project(":presentation-compiler"), project(":ac")]
    // The isolated classpath is materialized from project runtime classpaths,
    // which include sibling jars.  Declare those jar producers explicitly so
    // Gradle's task validation cannot observe an implicit mcmod/ac artifact
    // dependency when this gate is part of a larger platform verification.
    dependsOn neutralProjects.collect { it.tasks.named("jar") }
    // Gradle 9 rejects resolving a child project's Configuration while this
    // JavaExec task's inputs are being snapshotted.  Resolve this deliberately
    // at configuration time instead: it still contains only api/mcmod/ac
    // runtime entries, and the task continues to launch a fresh, isolated JVM.
    def neutralRuntimeClasspath = neutralProjects.collectMany {
        it.sourceSets.main.runtimeClasspath.files
    }
    classpath = files(neutralRuntimeClasspath)
    mainClass = "clojure.main"
    doFirst {
        def catalog = rootProject.ext.platformCatalog()
        def factorySymbols = catalog.targets.values()
            .collectMany { target -> targetProviderDescriptors(target) }
            .collect { descriptor -> "${descriptor.namespace}/${descriptor.function}" }
            .unique()
            .sort()
        // The command intentionally does no factory invocation: it proves the
        // source closure can be required on an isolated neutral classpath,
        // while provider validation itself remains an initialization concern.
        args = ["-e", "(doseq [factory '[${factorySymbols.join(' ')}]] (requiring-resolve factory))"]
    }
}

tasks.register("verifyVersionSeamParity") {
    group = "verification"
    description = "Ensure each target has at most one MC version component and version-seam members match across versions."
    doLast {
        def catalog = rootProject.ext.platformCatalog()
        def components = catalog.components ?: [:]
        def problems = []

        catalog.targets.each { targetId, target ->
            def versionComponents = (target.sourceComponents ?: []).findAll { componentId ->
                def component = components[componentId.toString()]
                component != null && component.kind?.toString() == "minecraft"
            }
            if (versionComponents.size() > 1) {
                problems << "${targetId}: multiple minecraft version components ${versionComponents}"
            }
        }

        components.each { componentId, component ->
            if (component.kind?.toString() == "minecraft" && !component.javaNamespace) {
                problems << "component ${componentId} (kind:minecraft) must declare javaNamespace"
            }
        }

        // Shared components (minecraft-base, neoforge-shared, …) must not reference
        // versioned Minecraft or loader namespaces declared via javaNamespace.
        def forbiddenPatterns = components.findAll { id, component ->
            def kind = component.kind?.toString() ?: ""
            component.javaNamespace && (kind == "minecraft" || kind == "loader")
        }.collect { id, component ->
            Pattern.compile(Pattern.quote(component.javaNamespace.toString()) + "\\.")
        }

        components.each { componentId, component ->
            def kind = component.kind?.toString() ?: ""
            if (!kind.endsWith("-shared") || !component.source) {
                return
            }
            def root = file(component.source.toString())
            ["**/*.clj", "**/*.cljc", "**/*.java"].each { pattern ->
                if (!root.directory) {
                    return
                }
                fileTree(root) { include pattern }.each { File src ->
                    src.eachLine { String line, int idx ->
                        forbiddenPatterns.each { Pattern forbiddenNs ->
                            if (forbiddenNs.matcher(line).find()) {
                                problems << "${componentId} must not reference version namespaces: ${src}:${idx + 1}"
                            }
                        }
                    }
                }
            }
        }

        def seamSets = [:]
        components.each { componentId, component ->
            if (component.kind?.toString() != "minecraft" || !component.source) {
                return
            }
            def root = file(component.source.toString())
            def seamRoot = new File(root, "java/cn/li/mcver")
            def names = new TreeSet()
            if (seamRoot.directory) {
                fileTree(seamRoot) {
                    include "**/*.java"
                }.each { File src ->
                    def rel = seamRoot.toPath().relativize(src.toPath()).toString().replace("\\", "/")
                    names << rel.replaceAll(/\.java$/, "").replace("/", ".")
                }
            }
            def cljSeam = new File(root, "clojure/cn/li/mcver")
            if (cljSeam.directory) {
                fileTree(cljSeam) { include "**/*.clj" }.each { File src ->
                    def rel = cljSeam.toPath().relativize(src.toPath()).toString().replace("\\", "/")
                    names << rel.replaceAll(/\.clj$/, "").replace("/", ".").replace("_", "-")
                }
            }
            seamSets[componentId.toString()] = names
        }

        def reference = seamSets.find { k, v -> !v.isEmpty() }
        if (reference != null) {
            seamSets.each { componentId, names ->
                if (names != reference.value) {
                    problems << "version seam mismatch for ${componentId}: expected ${reference.value}, found ${names}"
                }
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException("verifyVersionSeamParity failed:\n" + problems.take(40).join("\n"))
        }
        logger.lifecycle("[verifyVersionSeamParity] ok ({} version components)", seamSets.size())
    }
}

tasks.register("verifyMinecraftComponentNeutrality") {
    group = "verification"
    description = "Ensure Minecraft version components do not import a specific loader API."
    doLast {
        def catalog = rootProject.ext.platformCatalog()
        def problems = []
        (catalog.components ?: [:]).each { componentId, component ->
            if (component.kind?.toString() != "minecraft" || !component.source) {
                return
            }
            def root = file(component.source.toString())
            if (!root.directory) {
                problems << "${componentId}: missing source root ${component.source}"
                return
            }
            fileTree(root) {
                include "**/*.java"
                include "**/*.clj"
                include "**/*.cljc"
                exclude "**/build/**"
                exclude "**/.gradle/**"
            }.each { File source ->
                source.eachLine { String line, int number ->
                    if (line ==~ /.*\bnet\.(minecraftforge|neoforged|fabricmc)\..*/) {
                        problems << "${componentId}: loader import in ${source}:${number}: ${line.trim()}"
                    }
                    if (line ==~ /.*\bdev\.architectury\..*/) {
                        problems << "${componentId}: Architectury import in ${source}:${number}: ${line.trim()}"
                    }
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Minecraft component neutrality violations:\n" + problems.take(80).join("\n"))
        }
        logger.lifecycle("[verifyMinecraftComponentNeutrality] ok")
    }
}

tasks.register("verifyPresentationArtifacts") {
    group = "verification"
    description = "Require every declarative UI source to compile into the Presentation artifact catalog."
    dependsOn ":ac:compilePresentationViews"
    doLast {
        def sourceRoot = file("ac/src/presentation/resources")
        def generatedRoot = file("build/neutral/ac/generated/resources/presentation")
        def manifest = new File(generatedRoot, "META-INF/presentation/catalog.edn")
        if (!manifest.isFile()) {
            throw new GradleException("Presentation catalog missing: " + manifest)
        }
        def sources = fileTree(sourceRoot).matching { include "**/*.ui.edn" }.files
        if (sources.size() < 7) {
            throw new GradleException("Expected all declarative UI surfaces under " + sourceRoot + "; found " + sources.size())
        }
        def manifestText = manifest.getText("UTF-8")
        sources.each { source ->
            def text = source.getText("UTF-8")
            def matcher = text =~ /:view\/id\s+(:[A-Za-z0-9_.-]+\/[A-Za-z0-9_-]+)/
            if (!matcher.find()) {
                throw new GradleException("UI source has no :view/id: " + source)
            }
            def viewId = matcher.group(1)
            if (!manifestText.contains(viewId.substring(1))) {
                throw new GradleException("Compiled manifest is missing " + viewId + " from " + source)
            }
        }
        // High-level component names are compile-time syntax only.  A runtime
        // artifact must contain primitive nodes and numeric/catalog metadata;
        // reject both component tags and their legacy spelling in generated
        // files so a future compiler change cannot silently reintroduce the
        // forbidden runtime dependency on TreeView/ListView.
        def artifactFiles = fileTree(generatedRoot).matching { include "**/*.uic.edn" }.files
        def forbiddenArtifactTokens = [~/(?i)tree-view/, ~/(?i)list-view/, ~/:component\b/]
        def artifactResidues = artifactFiles.collectMany { artifact ->
            def text = artifact.getText("UTF-8")
            forbiddenArtifactTokens.findAll { token -> token.matcher(text).find() }
                    .collect { token -> artifact.toString() + " contains " + token }
        }
        if (!artifactResidues.isEmpty()) {
            throw new GradleException("High-level UI names leaked into runtime artifacts: " + artifactResidues)
        }
        def legacyRoots = [
            file("ac/src/main/resources/assets/academy/presentation"),
            file("presentation-compiler/src/main/clojure/cn/li/presentation/compiler/core.clj"),
            file("presentation-compiler/src/main/clojure/cn/li/presentation/compiler/render.clj")
        ]
        def residues = legacyRoots.findAll { it.exists() }
        if (!residues.isEmpty()) {
            throw new GradleException("Legacy Presentation UI residues remain: " + residues)
        }
        logger.lifecycle("[verifyPresentationArtifacts] ok (" + sources.size() + " sources)")
    }
}

tasks.register("verifyPresentationMigrationInventory") {
    group = "verification"
    description = "Verify the main-branch UI contract includes code-built, native and declarative surfaces."
    doLast {
        def contract = file("docs/06-gui/presentation/main-ui-contract.edn")
        if (!contract.isFile()) throw new GradleException("Main UI migration contract missing: " + contract)
        def text = contract.getText("UTF-8")
        def required = [":baseline", ":source-kinds", ":surfaces", ":unreachable-candidates", ":required-migration-fields",
                        ":main-evidence", ":state-schema", ":actions", ":effects", ":layout", ":assets", ":semantics", ":artifact", ":reducer", ":targets", ":snapshot-fixtures"]
        def missing = required.findAll { !text.contains(it) }
        if (!missing.isEmpty()) throw new GradleException("Main UI contract is incomplete: " + missing)
        def kinds = [":xml", ":static-code", ":dynamic-code", ":direct-render", ":native-menu", ":mixed"]
        def missingKinds = kinds.findAll { !text.contains(it) }
        if (!missingKinds.isEmpty()) throw new GradleException("Main UI contract misses source kinds: " + missingKinds)
        def surfaceCount = (text =~ /:id\s+:[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+/).count
        if (surfaceCount < 35) throw new GradleException("Main UI contract has too few surfaces: " + surfaceCount)
        ["ac/src/main/clojure/cn/li/ac/block/wireless_matrix/matrix_info_reactive.clj",
         "ac/src/main/clojure/cn/li/ac/block/wireless_node/node_info_reactive.clj",
         "ac/src/main/clojure/cn/li/ac/ability/client/reactive_hud.clj",
         "ac/src/main/clojure/cn/li/ac/terminal/client/runtime.clj"].each { path ->
            if (!file(path).isFile()) throw new GradleException("Code-built UI evidence missing: " + path)
        }
        logger.lifecycle("[verifyPresentationMigrationInventory] ok (${surfaceCount} main-branch surfaces; code-built UI included)")
    }
}
tasks.register("verifyPresentationSurfaceCoverage") {
    group = "verification"
    description = "Verify the logical Presentation surface inventory and its quantitative acceptance counts."
    dependsOn "verifyPresentationArtifacts"
    doLast {
        def surfaceSource = file("ac/src/main/clojure/cn/li/ac/gui/presentation_surface_manifest.clj")
        def guiManifestSource = file("ac/src/main/clojure/cn/li/ac/gui/manifest.clj")
        if (!surfaceSource.isFile() || !guiManifestSource.isFile()) {
            throw new GradleException("Presentation surface manifests are missing")
        }
        def surfaceText = surfaceSource.getText("UTF-8")
        def guiText = guiManifestSource.getText("UTF-8")
        def applicationBlock = surfaceText.substring(surfaceText.indexOf("(def application-surfaces"),
                surfaceText.indexOf("(defn- container-surface"))
        def applicationCount = (applicationBlock =~ /:artifact\s+:academy\.app\//).count
        def containerCount = (guiText =~ /:gui-name\s+"/).count
        def applicationControllerCount = (applicationBlock =~ /:controller\s+/).count
        def containerControllerCount = (guiText =~ /:screen-factory-fn-kw\s+:create-/).count
        def controllerCount = applicationControllerCount + containerControllerCount
        if (applicationCount != 13 || containerCount != 11 || controllerCount != 24) {
            throw new GradleException("Presentation surface coverage mismatch: applications=" +
                    applicationCount + ", containers=" + containerCount +
                    ", controllers=" + controllerCount)
        }
        if (applicationCount + containerCount != 24) {
            throw new GradleException("Expected 24 active Presentation surfaces")
        }
        logger.lifecycle("[verifyPresentationSurfaceCoverage] ok (24/24 surfaces, 11/11 containers, 24/24 controllers)")
    }
}

tasks.register("verifyPresentationRuntimeZeroResidues") {
    group = "verification"
    description = "Verify zero runtime compiler/legacy-template dependencies and no UI source reads at runtime."
    dependsOn "verifyPresentationArtifacts"
    doLast {
        def coreBuild = file("presentation-core/build.gradle").getText("UTF-8")
        def coreSources = fileTree("presentation-core/src/main") { include "**/*.clj", "**/*.java" }.files
        def sourceText = coreSources.collect { it.getText("UTF-8") }.join("\n")
        if (coreBuild =~ /(?:api|implementation)\s+project\(["']?:presentation-compiler/ ||
                sourceText =~ /cn\.li\.presentation\.compiler/) {
            throw new GradleException("presentation-core has a runtime compiler dependency")
        }
        def uiProductionRoots = [file("ac/src/main"), file("mcmod/src/main"),
                                 file("platform-src"), file("presentation-core/src/main"),
                                 file("presentation-compiler/src/main")]
        def uiProductionText = uiProductionRoots.findAll { it.directory }.collectMany { root ->
            fileTree(root) { include "**/*.clj", "**/*.java", "**/*.edn" }.files
        }.collect { it.getText("UTF-8") }.join("\n")
        def oldApi = uiProductionText =~ /(?:CompiledTemplate|UiRt|mount-tree!|reconcile-tree!|layout-tree!|retained-tree)/
        if (oldApi.find()) {
            throw new GradleException("legacy Presentation ViewModel/API reference remains")
        }
        def oldTemplates = []
        [file("ac/src/main/resources/assets/academy/presentation"),
         file("presentation-core/src/main/clojure/cn/li/presentation/core/render.clj"),
         file("presentation-compiler/src/main/clojure/cn/li/presentation/compiler/render.clj")].each {
            if (it.exists()) oldTemplates << it
        }
        oldTemplates.addAll(fileTree("ac/src/main") { include "**/*.xml" }.files)
        if (!oldTemplates.isEmpty()) {
            throw new GradleException("legacy UI templates/fallback roots remain: " + oldTemplates)
        }
        if (sourceText =~ /(?:read-resource|io\/resource|slurp|io\/reader)[^\n]*\.ui\.edn/) {
            throw new GradleException("runtime Presentation source reads .ui.edn")
        }
        logger.lifecycle("[verifyPresentationRuntimeZeroResidues] ok (compiler=0, old-api=0, templates/fallback=0, runtime-ui-edn-read=0)")
    }
}
