tasks.register("verifyPlatformResourceOwnership") {
    group = "verification"
    description = "Allow only loader metadata and unavoidable version-specific resources in platform source roots."
    doLast {
        def platformRoot = file("platform-src")
        def unexpected = []
        if (platformRoot.directory) {
            fileTree(platformRoot) {
                include "**/src/main/resources/**"
            }.files.each { File resource ->
                def rel = platformRoot.toPath().relativize(resource.toPath()).toString().replace("\\", "/")
                def allowed =
                    (rel ==~ /loader\/[^\/]+\/src\/main\/resources\/(fabric\.mod\.json|academy\.mixins\.json|pack\.mcmeta)/) ||
                    (rel ==~ /loader\/[^\/]+\/src\/main\/resources\/META-INF\/(mods\.toml|neoforge\.mods\.toml)/) ||
                    (rel == "minecraft/mc-1.21.1/src/main/resources/data/academy/pack.mcmeta") ||
                    (rel == "minecraft/mc-26.2/src/main/resources/data/academy/pack.mcmeta") ||
