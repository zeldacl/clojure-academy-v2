tasks.register("verifyNeutralSourceAotXor") {
    group = "verification"
    description = "Ensure every neutral Clojure namespace is packaged as source XOR AOT class."
    dependsOn ":ac:assembleNeutralRuntimeSources"
    doLast {
        def violations = []
        rootProject.ext.neutralSourceFirstProjects.each { projectPath ->
            def p = project(projectPath)
            def sourceNamespaces = [] as Set
            p.sourceSets.main.clojure.srcDirs.findAll { it.directory }.each { File root ->
                fileTree(root) { include "**/*.clj"; include "**/*.cljc" }.files.each { File f ->
                    def rel = root.toPath().relativize(f.toPath()).toString().replace('\\','/')
                    sourceNamespaces << rel.replaceAll(/\.cljc?$/, '').replace('/','.')
                        .replace('_','-')
                }
            }
            def classRoots = [
                p.layout.buildDirectory.dir("clojure/main").get().asFile,
                p.layout.buildDirectory.dir("classes/java/main").get().asFile
            ]
            def aotNamespaces = [] as Set
            classRoots.findAll { it.directory }.each { File root ->
                fileTree(root) { include "**/*__init.class" }.files.each { File f ->
                    def rel = root.toPath().relativize(f.toPath()).toString().replace('\\','/')
                    aotNamespaces << rel.replaceFirst(/__init\.class$/, '').replace('/','.')
                        .replace('_','-')
                }
            }
            def overlap = sourceNamespaces.intersect(aotNamespaces)
            if (!rootProject.ext.fullAotEnabled && !overlap.isEmpty()) {
                violations << "${projectPath}: neutral namespaces present as both source and AOT: ${overlap.sort()}"
            }
            if (rootProject.ext.fullAotEnabled) {
                def missing = sourceNamespaces.findAll { !(it in aotNamespaces) }
                if (!missing.isEmpty()) violations << "${projectPath}: fullAot missing classes: ${missing.sort()}"
            }
        }
        if (!violations.isEmpty()) throw new GradleException(violations.join("\n"))
        logger.lifecycle("[verifyNeutralSourceAotXor] ok")
    }
}

// In diagnostic full-AOT mode the verifier must build the neutral class
// outputs first; otherwise it would report every source namespace as missing
