tasks.register("verifyOptionalIntegrations") {
    group = "verification"
    description = "Verify JEI is a real typed adapter and IC2 reflection stays inside the optional third-party boundary."
    doLast {
        def catalog = new groovy.json.JsonSlurper().parse(file("platform-catalog.json"))
        def jeiTargets = [
            [id: "forge-1.20.1", loader: "forge", wrapper: "platform-src/loader/forge-1.20.1/src/main/java/cn/li/forge1201/integration/JEIPluginWrapper.java", impl: "platform-src/loader/forge-1.20.1/src/main/clojure/cn/li/forge1201/integration/jei_impl.clj"],
            [id: "fabric-1.20.1", loader: "fabric", wrapper: "platform-src/loader/fabric-1.20.1/src/main/java/cn/li/fabric1201/integration/JEIPluginWrapper.java", impl: "platform-src/loader/fabric-1.20.1/src/main/clojure/cn/li/fabric1201/integration/jei_impl.clj"],
            [id: "fabric-1.21.1", loader: "fabric", wrapper: "platform-src/loader/fabric-1.21.1/src/main/java/cn/li/fabric1211/integration/JEIPluginWrapper.java", impl: "platform-src/loader/fabric-1.21.1/src/main/clojure/cn/li/fabric1211/integration/jei_impl.clj"],
            [id: "neoforge-1.21.1", loader: "neoforge", wrapper: "platform-src/loader/neoforge-1.21.1/src/main/java/cn/li/neoforge1211/integration/JEIPluginWrapper.java", impl: "platform-src/loader/neoforge-1.21.1/src/main/clojure/cn/li/neoforge1211/integration/jei_impl.clj"],
            [id: "neoforge-26.2", loader: "neoforge", wrapper: "platform-src/loader/neoforge-26.2/src/main/java/cn/li/neoforge262/integration/JEIPluginWrapper.java", impl: "platform-src/loader/neoforge-26.2/src/main/clojure/cn/li/neoforge262/integration/jei_impl.clj"],
            [id: "fabric-26.2", loader: "fabric", wrapper: "platform-src/loader/fabric-26.2/src/main/java/cn/li/fabric262/integration/JEIPluginWrapper.java", impl: "platform-src/loader/fabric-26.2/src/main/clojure/cn/li/fabric262/integration/jei_impl.clj"]
        ]
        jeiTargets.each { spec ->
            def target = catalog.targets[spec.id]
            def caps = (target.capabilities ?: []) as List
            if (!("jei" in caps) || !(target.capabilityOwners?.jei ?: []).contains(spec.id)) {
                throw new GradleException("${spec.id} must declare exactly one JEI capability owner")
            }
            def wrapper = file(spec.wrapper)
            def impl = file(spec.impl)
            if (!wrapper.isFile() || !impl.isFile() || wrapper.text.contains("placeholder") || impl.text.contains("stub")) {
                throw new GradleException("${spec.id} JEI adapter must be a real typed implementation")
            }
            if (spec.loader == "fabric" && !file("platform-src/loader/${spec.id}/src/main/resources/fabric.mod.json").text.contains("jei_mod_plugin")) {
                throw new GradleException("${spec.id} must expose the JEI Fabric entrypoint")
            }
        }
        def ic2Files = [
            file("platform-src/platform/shared/src/main/clojure/cn/li/platform/optional/ic2_energy.clj")
        ]
        def allowlistedReflection = ~/java\.lang\.reflect|Class\/forName|Proxy\/newProxyInstance|Method\.invoke|setAccessible|clojure\.lang\.Reflector|getDeclaredConstructor/
        def forbiddenOutsideIsland = []
        def applicationMainRoots = [file("ac/src/main"), file("mcmod/src/main"), file("api/src/main")]
        def platformMainRoot = file("platform-src")
        applicationMainRoots.findAll { it.directory }.each { root ->
            fileTree(root) { include "**/*.clj"; include "**/*.java" }.files.each { source ->
                if (!ic2Files.contains(source) && (source.text =~ allowlistedReflection).find()) {
                    forbiddenOutsideIsland << source
                }
            }
        }
        if (platformMainRoot.directory) {
            fileTree(platformMainRoot) {
                include "**/src/main/**/*.clj"
                include "**/src/main/**/*.cljc"
                include "**/src/main/**/*.java"
            }.files.each { source ->
                if (!ic2Files*.canonicalFile.contains(source.canonicalFile) && (source.text =~ allowlistedReflection).find()) {
                    forbiddenOutsideIsland << source
                }
            }
        }
        if (!forbiddenOutsideIsland.isEmpty()) {
            throw new GradleException("Reflection is only permitted in the IC2 third-party adapter: ${forbiddenOutsideIsland}")
        }
        ic2Files.each { source ->
            if (source.text.contains("requiring-resolve") || source.text.contains("cap-call")) {
                throw new GradleException("IC2 adapter must use direct capability callbacks: ${source}")
            }
        }
        logger.lifecycle("[verifyOptionalIntegrations] JEI typed adapters and IC2 reflection island verified")
    }
}

tasks.register("verifyPresentationLoaderHooks") {
    group = "verification"
    description = "Ensure each loader render callback enters the neutral Presentation host seam."
    doLast {
        def roots = ["platform-src/loader"].collect { file(it) }
        def requiredFiles = []
        roots.findAll { it.directory }.each { File root ->
            fileTree(root) {
                include "**/presentation_hud_renderer.clj"
                include "**/presentation_world_renderer.clj"
            }.files.each { File source -> requiredFiles << source }
        }
        def missing = requiredFiles.findAll { source ->
            source.name == "presentation_hud_renderer.clj"
                ? !source.text.contains("cn.li.platform.neutral.presentation")
                : !(source.text.contains("cn.li.platform.neutral.presentation") ||
                    source.text.contains("cn.li.platform.neutral.vfx"))
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Loader Presentation hook missing:\n" + missing.join("\n"))
        }
        def overlays = requiredFiles.findAll { it.name == "presentation_hud_renderer.clj" }
        def backendMissing = overlays.findAll { source ->
            !source.text.contains("presentation-backend") || !source.text.contains("register-backend!")
        }
        if (!backendMissing.isEmpty()) {
                throw new GradleException("Loader Presentation HUD backend registration missing:\n" + backendMissing.join("\n"))
        }
        def extractionMissing = overlays.findAll { source ->
            !source.text.contains("submit-current-frame!")
        }
        if (!extractionMissing.isEmpty()) {
                throw new GradleException("Loader Presentation HUD frame extraction missing:\n" + extractionMissing.join("\n"))
        }
        logger.lifecycle("[verifyPresentationLoaderHooks] ok ({} loader render seams)", requiredFiles.size())
    }
}

