import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import org.gradle.internal.os.OperatingSystem
import java.util.regex.Pattern

buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm:9.10.1"
    }
}

plugins {
    id "dev.clojurephant.clojure" apply false
}

ext {
    def baseModVersion = findProperty("mod_version") ?: "0.0.0"
    def artifactBaseName = findProperty("mod_artifact_base_name")?.toString()?.trim()
    if (artifactBaseName == null || artifactBaseName.isEmpty()) {
        throw new GradleException("mod_artifact_base_name must not be empty")
    }
    def releaseSuffix = findProperty("mod_release_suffix")?.toString()?.trim()
    if (releaseSuffix != null && !releaseSuffix.isEmpty() &&
        !(releaseSuffix ==~ /(?i)(alpha|beta|rc)[0-9]+/)) {
        throw new GradleException(
            "-Pmod_release_suffix must match alpha1, beta2, rc1, etc.; got '${releaseSuffix}'")
    }
    modVersion = releaseSuffix == null || releaseSuffix.isEmpty()
        ? baseModVersion
        : "${baseModVersion}-${releaseSuffix}"
    modArtifactBaseName = artifactBaseName
    clojureVersions = [
        clojure: findProperty("clojure_version") ?: "1.13.0-alpha6",
        testCheck: findProperty("clojure_test_check_version") ?: "1.1.1",
        cloverage: findProperty("cloverage_version") ?: "1.2.4",
        malli: findProperty("malli_version") ?: "0.16.4",
        specAlpha: findProperty("spec_alpha_version") ?: "0.6.249",
        coreSpecsAlpha: findProperty("core_specs_alpha_version") ?: "0.6.122-alpha8"
    ]

    // Neutral runtime projects (:ac, :mcmod, :vfx-core and :combat-core) are source-first by default.
    // Pass -PfullAot or -PfullAot=true to restore the historical full-AOT build.
    def fullAotRaw = findProperty("fullAot")
    def fullAotText = fullAotRaw == null ? "false" : fullAotRaw.toString().trim()
    if (fullAotText.isEmpty()) {
        fullAotText = "true"
    }
    if (!fullAotText.equalsIgnoreCase("true") && !fullAotText.equalsIgnoreCase("false")) {
        throw new GradleException("-PfullAot must be true or false (or pass -PfullAot for true), got '${fullAotRaw}'")
    }
    fullAotEnabled = fullAotText.equalsIgnoreCase("true")
    // Neutral Clojure projects remain source-first in normal platform builds.
    // Only platform namespaces that touch Minecraft/Loader APIs are required
    // to be AOT/remapped.  The explicit fullAot switch remains available for
    // the historical diagnostic build mode.
    neutralSourceFirstProjects = [":ac", ":mcmod", ":vfx-core", ":combat-core"]
}

allprojects {
    group = rootProject.findProperty("mod_group")
    version = rootProject.ext.modVersion

    repositories {
        mavenCentral()
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.minecraftforge.net" }
        maven { url "https://maven.neoforged.net/releases/" }
        maven { url "https://repo.clojars.org" }
        maven {
            url = "https://maven.blamejared.com"
            name = "BlameJared Maven"
        }
    }
}

// Clojurephant exposes compileClojure late in project evaluation. Declare the
// cross-module AOT ordering after all projects are evaluated so Gradle 8's
// implicit-output validation cannot race presentation-core and its consumers.
gradle.projectsEvaluated {
    [":presentation-compiler"].each { consumerPath ->
        def consumer = findProject(consumerPath)
        def core = findProject(":presentation-core")
        if (consumer != null && core != null &&
            consumer.tasks.findByName("compileClojure") != null &&
            core.tasks.findByName("compileClojure") != null) {
            consumer.tasks.matching { it.name in ["compileJava", "checkClojure", "compileClojure", "compileTestJava", "compileTestClojure"] }
                .configureEach {
                    dependsOn core.tasks.named("compileClojure")
                }
        }
    }
    def ac = findProject(":ac")
    def compiler = findProject(":presentation-compiler")
    def core = findProject(":presentation-core")
    def vfx = findProject(":vfx-core")
    def combat = findProject(":combat-core")
    if (ac != null && compiler != null && core != null) {
        ["compileJava", "checkClojure", "compileClojure", "compileTestClojure"].each { taskName ->
            def task = ac.tasks.findByName(taskName)
            if (task != null) {
                task.dependsOn compiler.tasks.named("compileClojure"), core.tasks.named("compileClojure")
                if (vfx != null) {
                    task.dependsOn vfx.tasks.named("classes")
                }
                if (combat != null) {
                    task.dependsOn combat.tasks.named("classes")
                }
            }
        }
    }
}

subprojects {
    plugins.withId("dev.clojurephant.clojure") {
        local.ClojurephantFlushFix.configure(project)
        // Platform source roots are selected dynamically from the catalog.
        // Configure after their sourceSets are complete, otherwise aotAll()
        // snapshots an empty namespace set for :platform.
        afterEvaluate {
            // Every Clojure-bearing module is a runtime module. Keep the AOT
            // policy here so new modules cannot accidentally ship source-only
            // or partially AOT-compiled namespaces.
            clojure {
                builds {
                    main {
                        if (rootProject.ext.fullAotEnabled || !(project.path in rootProject.ext.neutralSourceFirstProjects)) {
                            aotAll()
                        } else {
                            // Empty AOT set keeps the plugin available for source
                            // compilation/checking while avoiding neutral-project AOT.
                            aotNamespaces.set([])
                        }
                        checkAll()
                        reflection = "fail"
                    }
                }
            }

            tasks.named("compileClojure").configure { task ->
                doLast {
                    if (!rootProject.ext.fullAotEnabled && project.path in rootProject.ext.neutralSourceFirstProjects) {
                        return
                    }
                    def sourceRoots = sourceSets.main.clojure.srcDirs.findAll { it.isDirectory() }
                    def missingAotClasses = sourceRoots.collectMany { File sourceRoot ->
                        fileTree(sourceRoot) { include "**/*.clj" }.files.collect { File sourceFile ->
                            def namespaceName = sourceRoot.toPath()
                                .relativize(sourceFile.toPath())
                                .toString()
                                .replace("\\", "/")
                                .replaceAll(/\.clj$/, "")
                                .replace("/", ".")
                                .replace("_", "-")
                            def outputDirectory = layout.buildDirectory.dir("clojure/main").get().asFile
                            [namespaceName, new File(outputDirectory, namespaceName.replace(".", "/").replace("-", "_") + "__init.class")]
                        }
                    }.findAll { namespaceAndClass -> !namespaceAndClass[1].isFile() }
                    if (!missingAotClasses.isEmpty()) {
                        throw new GradleException("Full AOT output is incomplete for ${project.path}: " +
                            missingAotClasses.collect { it[0] }.sort())
                    }
                }
            }
        }
        // Clojurephant forks a dedicated JVM for AOT (not JavaExec). Inject via forkOptions.
        // Loom 1.13 tiny-remapper AIOOBE on Clojure 1.13 :doc metadata; elide :doc only,
        // keep :file/:line for crash stack lines.
        def ensureClojureForkJvmArg = { task, String arg ->
            def args = (task.forkOptions.jvmArgs ?: []) as List
            if (!args.contains(arg)) {
                args << arg
            }
            task.forkOptions.jvmArgs = args
        }
        tasks.matching { it.name in ["compileClojure", "compileTestClojure"] }.configureEach { task ->
            if (!task.forkOptions.memoryMaximumSize) {
                task.forkOptions.memoryMaximumSize = "1536m"
            }
            ensureClojureForkJvmArg(task, "-Dfile.encoding=UTF-8")
            ensureClojureForkJvmArg(task, "-XX:+UseG1GC")
            ensureClojureForkJvmArg(task, "-Dclojure.compile.elide-meta=[:doc]")
        }
        // Other Clojurephant forked tasks (e.g. checkClojure) keep baseline JVM settings.
        tasks.matching { task ->
            task.name !in ["compileClojure", "compileTestClojure"] &&
                task.metaClass.hasProperty(task, "forkOptions") != null
        }.configureEach { task ->
            if (!task.forkOptions.memoryMaximumSize) {
                task.forkOptions.memoryMaximumSize = "1536m"
            }
            ensureClojureForkJvmArg(task, "-Dfile.encoding=UTF-8")
            ensureClojureForkJvmArg(task, "-XX:+UseG1GC")
        }
    }

    plugins.withType(JavaPlugin) {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
        }
        tasks.withType(JavaCompile).configureEach {
            options.release = 17
        }
        tasks.withType(Jar).configureEach {
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}

ext.platformCatalog = {
    new JsonSlurper().parse(rootProject.file("platform-catalog.json"))
}

tasks.register("verifyNoLegacyArchitecture") {
    group = "verification"
    description = "Fail if deleted platform-module architecture returns."
    doLast {
        def forbiddenDirs = ["mc-1.20.1", "forge-1.20.1", "fabric-1.20.1", "test-support", "platform-target"]
            .collect { rootProject.file(it) }
            .findAll { it.exists() }
        if (!forbiddenDirs.isEmpty()) {
            throw new GradleException("Legacy root directories still exist: " + forbiddenDirs)
        }
    }
}

tasks.register("verifyNoThinForwarders") {
    group = "verification"
    description = "Fail if old platform SPI or forwarding bootstrap code remains."
    doLast {
        def offenders = fileTree(rootProject.projectDir) {
            include "api/src/main/java/**/PlatformBootstrap*.java"
            include "mcmod/src/main/java/**/PlatformBootstrap*.java"
            include "platform-src/**/Platform*Bootstrap*.java"
            include "platform-src/**/bootstrap_entry.clj"
            include "platform-src/**/spi_bootstrap.clj"
            include "platform-src/**/META-INF/services/cn.li.mcmod.platform.spi.PlatformBootstrap"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/gui_open.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/media_library.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/media_playback.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/saved_data.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/damage_interception.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/config_persist.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/events.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/world_owner_key.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/energy_integration.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/command_runtime.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/integration_runtime.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/runtime_interop.clj"
            include "mcmod/src/main/clojure/cn/li/mcmod/platform/named_position_store.clj"
            exclude "**/build/**"
            exclude "**/.gradle/**"
        }.files
        if (!offenders.isEmpty()) {
            throw new GradleException("Thin/legacy platform bootstrap residues remain: " + offenders)
        }
    }
}

tasks.register("verifyNoCompatibilityResidues") {
    group = "verification"
    description = "Fail if old compatibility or partial platform install APIs return."
    doLast {
        def patterns = [
            ~/Backward compatible/,
            ~/backward compatible/,
            ~/install-[A-Za-z0-9_-]+-only!/,
            ~/install-platform-foundation\+hooks!/,
            ~/install-foundation!/
        ]
        def hits = []
        fileTree(rootProject.projectDir) {
            include "mcmod/src/main/clojure/**/*.clj"
            include "platform-src/**/*.clj"
            exclude "**/build/**"
            exclude "**/.gradle/**"
        }.files.each { File f ->
            f.eachLine { line, number ->
                patterns.each { pattern ->
                    if ((line =~ pattern).find()) {
                        hits << "${rootDir.toPath().relativize(f.toPath())}:${number}: ${line.trim()}"
                    }
                }
            }
        }
        if (!hits.isEmpty()) {
            throw new GradleException("Compatibility/partial-install residues remain:\n" + hits.join("\n"))
        }
    }
}

tasks.register("verifyNoDuplicateCapabilities") {
    group = "verification"
    description = "Verify each target capability has exactly one owner."
    doLast {
        def problems = []
        rootProject.ext.platformCatalog().targets.each { id, target ->
            def components = rootProject.ext.platformCatalog().components ?: [:]
            ((target.sourceComponents ?: []) + (target.testComponents ?: [])).each { componentId ->
                if (!components.containsKey(componentId.toString())) {
                    problems << "${id}: unknown component ${componentId}"
                }
            }
            (target.capabilities ?: []).each { capability ->
                def owners = (target.capabilityOwners ?: [:])[capability] ?: []
                if (owners.size() != 1) {
                    problems << "${id}:${capability} owners=${owners}"
                } else if (!components.containsKey(owners.first().toString())) {
                    problems << "${id}:${capability} unknown owner=${owners.first()}"
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Invalid capability ownership:\n" + problems.join("\n"))
        }
    }
}

tasks.register("verifyPlatformCatalog") {
    group = "verification"
    description = "Verify platform catalog targets compose declared components only."
    doLast {
        def catalog = rootProject.ext.platformCatalog()
        def components = catalog.components ?: [:]
        def profiles = catalog.buildProfiles ?: [:]
        def problems = []
        if ((catalog.javaBaseline ?: 0) as int < 17) {
            problems << "javaBaseline must be at least 17 because api uses Java 17 language/library features"
        }
        if (profiles.isEmpty()) {
            problems << "catalog has no buildProfiles"
        }
        profiles.each { profileId, profile ->
            if (!profile.gradleVersion || !profile.gradleJvmVersion || !profile.wrapper) {
                problems << "buildProfile ${profileId} must declare gradleVersion, gradleJvmVersion and wrapper"
            }
        }
        if (components.isEmpty()) {
            problems << "catalog has no components"
        }
        components.each { id, component ->
            if (id.toString().toLowerCase().startsWith("ac-") || component.content) {
                problems << "platform component ${id} must not bind a content module to a concrete platform"
            }
            ["source", "tests"].each { key ->
                if (component[key]) {
                    def componentPath = file(component[key].toString())
                    if (!componentPath.exists()) {
                        problems << "component ${id}.${key} missing path ${component[key]}"
                    }
                }
            }
        }
        catalog.targets.each { targetId, target ->
            ["buildProfile", "gradleJvmVersion", "compileJavaVersion", "runtimeJavaVersion"].each { key ->
                if (!target[key]) problems << "${targetId} missing ${key}"
            }
            if (target.loader?.toString() != "none" && !(target.neutralAotWhitelist instanceof Collection)) {
                problems << "${targetId} must declare neutralAotWhitelist (the reviewed mcmod AOT boundary)"
            }
            def manifests = target.providerManifests
            def expectedProviderSides = ["common", "server", "client", "datagen"] as Set
            def manifestSides = manifests instanceof Map
                ? (manifests.keySet().collect { it.toString() } as Set)
                : ([] as Set)
            if (!(manifests instanceof Map) || manifestSides != expectedProviderSides) {
                problems << "${targetId} providerManifests must contain exactly common/server/client/datagen"
            } else {
                manifests.each { side, modules ->
                    if (!(modules instanceof Collection)) {
                        problems << "${targetId} provider manifest ${side} must be a collection"
                    }
                    (modules ?: []).each { module ->
                        ["id", "namespace", "function", "provides"].each { key ->
                            if (!module[key]) problems << "${targetId} provider manifest ${side} missing ${key}"
                        }
                    }
                }
            }
            (target.contentProjects ?: []).each { projectId ->
                if (!rootProject.findProject(":${projectId}")) problems << "${targetId} references unknown content project ${projectId}"
            }
            if (target.buildProfile && !profiles.containsKey(target.buildProfile.toString())) {
                problems << "${targetId} references unknown buildProfile ${target.buildProfile}"
            }
            if (target.buildProfile && profiles[target.buildProfile.toString()] &&
                target.gradleJvmVersion as int != (profiles[target.buildProfile.toString()].gradleJvmVersion ?: 0) as int) {
                problems << "${targetId} gradleJvmVersion does not match buildProfile ${target.buildProfile}"
            }
            if ((target.compileJavaVersion ?: 0) as int < (catalog.javaBaseline ?: 17) as int) {
                problems << "${targetId} compileJavaVersion is below javaBaseline"
            }
            if ((target.runtimeJavaVersion ?: 0) as int < (target.compileJavaVersion ?: 17) as int) {
                problems << "${targetId} runtimeJavaVersion is below compileJavaVersion"
            }
            (target.sourceComponents ?: []).each { componentId ->
                def component = components[componentId.toString()]
                if (component == null) {
                    problems << "${targetId} source component ${componentId} is not declared"
                } else {
                    if (!component.source) {
                        problems << "${targetId} source component ${componentId} has no source root"
                    }
                    if (component.loader && component.loader != target.loader) {
                        problems << "${targetId} loader ${target.loader} does not match component ${componentId} loader ${component.loader}"
                    }
                    if (component.minecraftVersion && component.minecraftVersion != target.minecraftVersion) {
                        problems << "${targetId} Minecraft ${target.minecraftVersion} does not match component ${componentId} Minecraft ${component.minecraftVersion}"
                    }
                }
            }
            (target.testComponents ?: []).each { componentId ->
                def component = components[componentId.toString()]
                if (component == null) {
                    problems << "${targetId} test component ${componentId} is not declared"
                } else if (!(component.tests ?: component.source)) {
                    problems << "${targetId} test component ${componentId} has no tests/source root"
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Invalid platform catalog:\n" + problems.join("\n"))
        }
    }
}

tasks.register("verifyNoTargetHardcoding") {
    group = "verification"
    description = "Verify active build files use the catalog instead of legacy project paths."
    doLast {
        def legacyCatalogName = "platform-" + "targets.json"
        def oldCatalog = file(legacyCatalogName)
        if (oldCatalog.exists()) {
            throw new GradleException("Legacy target catalog remains: ${oldCatalog}")
        }
        def newCatalog = file("platform-catalog.json")
        if (!newCatalog.isFile()) {
            throw new GradleException("Missing platform catalog: ${newCatalog}")
        }
        def filesToScan = [file("settings.gradle"), file("build.gradle")] +
            fileTree("build-logic") { include "**/*.gradle" }.files +
            fileTree("platform") { include "**/*.gradle" }.files
        def forbidden = [
            legacyCatalogName,
            "project(':forge-" + "1.20.1')",
            "project(':fabric-" + "1.20.1')",
            "platform-src/minecraft/version/mc-" + "1201"
        ]
        def hits = []
        filesToScan.each { File f ->
            def text = f.text
            forbidden.each { token ->
                if (text.contains(token)) {
                    hits << "${rootDir.toPath().relativize(f.toPath())}: ${token}"
                }
            }
        }
        def sourceForbidden = [
            legacyCatalogName,
            ":forge-" + "1.20.1",
            ":fabric-" + "1.20.1",
            "\"forge-" + "1.20.1\"",
            "\"fabric-" + "1.20.1\""
        ]
        def sourceFilesToScan = files(
            fileTree("api") { include "**/*.java", "**/*.clj", "**/*.gradle" },
            fileTree("mcmod") { include "**/*.java", "**/*.clj", "**/*.gradle" },
            fileTree("ac") { include "**/*.java", "**/*.clj", "**/*.gradle" },
            fileTree("platform-src") { include "**/*.java", "**/*.clj", "**/*.gradle" },
            fileTree("platform") { include "**/*.java", "**/*.clj", "**/*.gradle" },
            fileTree("build-logic") { include "**/*.gradle" }
        ).files.findAll { File f ->
            !f.toPath().any { it.toString() in ["build", ".gradle"] }
        }
        sourceFilesToScan.each { File f ->
            def text = f.text
            sourceForbidden.each { token ->
                if (text.contains(token)) {
                    hits << "${rootDir.toPath().relativize(f.toPath())}: ${token}"
                }
            }
        }
        if (!hits.isEmpty()) {
            throw new GradleException("Legacy target hardcoding remains:\n" + hits.join("\n"))
        }
    }
}

tasks.register("verifyRepositoryHygiene") {
    group = "verification"
    description = "Verify generated/build residues are not inside platform source components."
    doLast {
        def residues = fileTree("platform-src") {
            include "**/.gradle/**"
            include "**/build/**"
            include "**/run/**"
            include "**/run-data/**"
            include "**/run-gametest/**"
            include "**/bin/**"
            exclude "**/src/**"
        }.files
        if (!residues.isEmpty()) {
            throw new GradleException("Generated residues remain under platform-src; remove explicit paths first. Count=${residues.size()}")
        }
    }
}

tasks.register("compareDatagenParityManifests") {
    group = "verification"
    description = "Compare generated datagen hash manifests for targets in the same parity group."
    doLast {
        def catalog = rootProject.ext.platformCatalog()
        def targetsByGroup = catalog.targets.findAll { id, target ->
            target.datagenParityGroup
        }.groupBy { id, target ->
            target.datagenParityGroup.toString()
        }
        def problems = []
        targetsByGroup.each { group, entries ->
            def manifests = entries.collectEntries { id, target ->
                def manifest = file("build/targets/${id}/platform/generated/datagen/${id}/META-INF/academy-datagen-hashes.json")
                manifest.isFile() ? [(id): new JsonSlurper().parse(manifest)] : [:]
            }
            if (manifests.size() < 2) {
                logger.lifecycle("[datagen-parity] group ${group}: need at least two manifests, found ${manifests.keySet().sort()}")
                return
            }
            def baselineId = manifests.keySet().sort().first()
            def baselineFiles = manifests[baselineId].files ?: [:]
            manifests.keySet().sort().findAll { it != baselineId }.each { id ->
                def files = manifests[id].files ?: [:]
                if (files != baselineFiles) {
                    def baselineKeys = baselineFiles.keySet() as Set
                    def keys = files.keySet() as Set
                    problems << [
                        group: group,
                        baseline: baselineId,
                        target: id,
                        missing: (baselineKeys - keys).sort(),
                        extra: (keys - baselineKeys).sort(),
                        changed: (baselineKeys.intersect(keys).findAll { k -> baselineFiles[k] != files[k] }).sort()
                    ]
                }
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException("Datagen parity mismatch:\n" + JsonOutput.prettyPrint(JsonOutput.toJson(problems)))
        }
    }
}

tasks.register("verifyUiXmlIds") {
    group = "verification"
    description = "Report reactive-UI node ids referenced from Clojure that no XML or build-child! declares. Run on demand; deliberately NOT part of any gate."
    doLast {
        // Why this is not a gate: a wrong id costs nothing until the branch
        // holding it actually runs, so it ships green and fails in front of a
        // player. But the match is textual -- ids built at runtime are invisible
        // to it -- so it advises rather than blocks.
        def xmlById = [:]
        fileTree(file("ac/src/main/resources/assets")) { include "**/guis/**/*.xml" }.each { File x ->
            xmlById[x.name] = (x.getText("UTF-8") =~ /id="([^"]+)"/).collect { it[1] } as Set
        }

        // Accessor forms that take a literal node id keyword.
        def refPattern = ~/(?:node-by-id|set-prop!|set-node-prop!|on-confirm-input|events\/on!|list-set!|register-event!)\s+\w+\s+(:[\w?*<>=+.\-]+)/
        def declPattern = ~/:id\s+(:[\w?*<>=+.\-]+)/
        def xmlRefPattern = ~/([\w\-]+\.xml)/

        def findings = []
        fileTree(file("ac/src/main/clojure")) { include "**/*.clj"; include "**/*.cljc" }.each { File src ->
            def text = src.getText("UTF-8")
            def names = (text =~ xmlRefPattern).collect { it[1] }.unique().findAll { xmlById.containsKey(it) }
            if (!names) return
            // Ids this namespace declares itself via rt/build-child! specs count
            // as declared -- tutorial's glow lines exist only at runtime.
            def declared = ((declPattern.matcher(text).collect { it[1] }) as Set)
            names.each { declared.addAll(xmlById[it].collect { id -> ":" + id }) }
            def refs = refPattern.matcher(text).collect { it[1] }
            // A keyword that also appears away from an accessor call is being
            // declared somewhere this scan cannot model -- a build-child! spec
            // built by a local helper, say. Only ids that exist *purely* as
            // lookups are suspect.
            def unresolved = (refs as Set)
                .findAll { !declared.contains(it) }
                .findAll { kw ->
                    def total = (text =~ (java.util.regex.Pattern.quote(kw) + /(?![\w?*<>=+.\-])/)).count
                    total <= refs.count { it == kw }
                }
                .sort()
            if (unresolved) {
                findings << "  ${rootProject.relativePath(src)} (${names.join(', ')}): ${unresolved.join(' ')}"
            }
        }

        if (findings) {
            logger.lifecycle("[verifyUiXmlIds] {} file(s) reference ids nothing declares:", findings.size())
            findings.each { logger.lifecycle(it) }
            logger.lifecycle("[verifyUiXmlIds] Note: ids assembled at runtime cannot be seen here; confirm before changing anything.")
        } else {
            logger.lifecycle("[verifyUiXmlIds] ok ({} gui xml files)", xmlById.size())
        }
    }
}

tasks.register("verifyNeutralClojureNoMinecraftApis") {
    group = "verification"
    description = "Fail if ac/mcmod Clojure sources or build.gradle files import or reference Minecraft/Forge/Fabric/NeoForge APIs."
    doLast {
        def roots = [
            file("ac/src/main/clojure"),
            file("ac/src/test/clojure"),
            file("mcmod/src/main/clojure"),
            file("mcmod/src/test/clojure"),
            file("vfx-core/src/main/clojure"),
            file("vfx-core/src/test/clojure"),
            file("combat-core/src/main/clojure"),
            file("combat-core/src/test/clojure")
        ].findAll { it.directory }
        // Real API refs look like net.minecraft.Foo ??docstrings saying "net.minecraft.*" do not match.
        def forbidden = ~/net\.(minecraft|minecraftforge|fabricmc|neoforged)\.[A-Za-z_]/
        // Neutral source is shipped as .clj in remapped Loom jars.  Project
        // platform classes are just as unsafe there as net.minecraft names:
        // Clojure would compile the original symbol after remap has finished.
        def internalPlatformForbidden = ~/cn\.li\.(mc1201|mc1211|mc262|mcbase|fabric1201|fabric1211|fabric262|fabricbase|forge1201|neoforge1211|neoforge262|neoforgebase)\.[A-Za-z_]/
        def violations = []
        roots.each { File root ->
            fileTree(root) { include "**/*.clj"; include "**/*.cljc" }.each { File src ->
                def inBlockComment = false
                src.eachLine { String line, int idx ->
                    def code = line
                    if (inBlockComment) {
                        def end = code.indexOf("*/")
                        if (end < 0) {
                            return
                        }
                        code = code.substring(end + 2)
                        inBlockComment = false
                    }
                    while (true) {
                        def start = code.indexOf("/*")
                        if (start < 0) {
                            break
                        }
                        def end = code.indexOf("*/", start + 2)
                        if (end < 0) {
                            code = code.substring(0, start)
                            inBlockComment = true
                            break
                        }
                        code = code.substring(0, start) + code.substring(end + 2)
                    }
                    def lineComment = code.indexOf(";")
                    if (lineComment >= 0) {
                        code = code.substring(0, lineComment)
                    }
                    // Drop string literals so docstring mentions do not trip the gate.
                    code = code.replaceAll(/"(?:\\.|[^\\"])*"/, "\"\"")
                    code = code.replaceAll(/'(?:\\.|[^\\'])*'/, "''")
                    def matcher = forbidden.matcher(code)
                    while (matcher.find()) {
                        violations << "${src}:${idx + 1}: ${matcher.group()}"
                    }
                    def internalMatcher = internalPlatformForbidden.matcher(code)
                    while (internalMatcher.find()) {
                        violations << "${src}:${idx + 1}: ${internalMatcher.group()}"
                    }
                }
            }
        }
        // Also ban loader coordinates in neutral-module build scripts.
        def gradleForbidden = ~/net\.(minecraftforge|fabricmc|neoforged):/
        ["ac/build.gradle", "mcmod/build.gradle", "vfx-core/build.gradle", "combat-core/build.gradle"].each { String path ->
            def gradleFile = file(path)
            if (!gradleFile.isFile()) {
                return
            }
            gradleFile.eachLine { String line, int idx ->
                def code = line
                def lineComment = code.indexOf("//")
                if (lineComment >= 0) {
                    code = code.substring(0, lineComment)
                }
                def matcher = gradleForbidden.matcher(code)
                while (matcher.find()) {
                    violations << "${gradleFile}:${idx + 1}: ${matcher.group()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                "Neutral layers (ac/mcmod) must not reference Minecraft/loader APIs.\n" +
                "Reflection Guard only catches untyped interop; (:import [net.minecraft...]) needs this gate.\n" +
                "Platform-only code belongs under platform-src.\n" +
                violations.take(40).join("\n") +
                (violations.size() > 40 ? "\n... and ${violations.size() - 40} more" : ""))
        }
        logger.lifecycle("[verifyNeutralClojureNoMinecraftApis] ok ({} roots)", roots.size())
    }
}

tasks.register("verifyPresentationJavaPurity") {
    group = "verification"
    description = "Ensure Presentation Java contracts stay free of Minecraft APIs and logic modules stay in Clojure."
    doLast {
        def roots = [file("presentation-core/src/main/java"),
                     file("presentation-compiler/src/main/java"),
                     // The sealed RenderCommand/RenderStage/RenderPass/FramePacket ABI moved
                     // into mcmod/runtime (Step 2) — it left presentation-core's own purity
                     // scan without ever being covered by a purity scan at all. Scoped to
                     // just this package, not all of mcmod/src/main/java, which also holds
                     // unrelated math/energy Java that is not part of the presentation ABI
                     // and is allowed to look like ordinary mcmod Java.
                     file("mcmod/src/main/java/cn/li/mcmod/runtime")]
        def violations = []
        roots.findAll { it.directory }.each { File root ->
            fileTree(root) { include "**/*.java" }.files.each { File source ->
                def text = source.text
                // Effect-runtime carriers are intentionally ordinary final
                // classes (primitive arrays plus constructor assignment),
                // which is the approved fixed-layout exception to the
                // presentation ABI purity rule.
                def effectCarrier = source.name in ["HostTable.java", "EntityBatch.java",
                                     "BlockBatch.java", "CompiledProgram.java",
                                     "ExecutionFrame.java", "VfxInstanceTable.java",
                                     "SlotArena.java", "BatchArena.java", "SignalRing.java"]
                if (text =~ /import\s+(net\.minecraft|net\.minecraftforge|net\.fabricmc|net\.neoforged)\./) {
                    violations << "${source}: presentation Java may not import Minecraft/loader APIs"
                }
                if (!effectCarrier && text =~ /\bclass\s+(?!.*Exception\b)[A-Za-z_][A-Za-z0-9_]*\s+\{/) {
                    violations << "${source}: presentation Java classes must be records/interfaces or data exceptions"
                }
                if (!effectCarrier && text =~ /\b(class|interface|record|enum)\s+[^\{]+\{[\s\S]*(for\s*\(|while\s*\(|switch\s*\(|\.submit\s*\(|\.run\s*\()/) {
                    // Data records and contracts may contain accessors/defaults;
                    // runtime loops/dispatch belong in Clojure.
                    violations << "${source}: executable loop/dispatch logic must be Clojure"
                }
            }
        }
        if (!violations.isEmpty()) throw new GradleException(violations.join("\n"))
        logger.lifecycle("[verifyPresentationJavaPurity] ok")
    }
}

tasks.register("verifyPresentationDependencyDirection") {
    group = "verification"
    description = "Enforce Presentation Runtime module dependency direction."
    doLast {
        def coreBuild = file("presentation-core/build.gradle").text
        def mcmodBuild = file("mcmod/build.gradle").text
        def acBuild = file("ac/build.gradle").text
        def platformBuild = file("build-logic/platform-target.gradle").text
        def violations = []
        // This check is intentionally source-oriented.  The platform targets
        // are generated from build-logic and therefore a future contributor
        // could accidentally reintroduce the forbidden edge in a different
        // Gradle convention plugin without touching the current declaration.
        // AC/compiler/devtools may mention the core project. Platform/base
        // must reach the shared contract through mcmod instead.
        fileTree(rootDir) {
            include "**/build.gradle"
            include "**/*.gradle"
            exclude "**/build/**"
            exclude "**/.gradle/**"
        }.files.each { File buildFile ->
            def path = rootDir.toPath().relativize(buildFile.toPath()).toString().replace('\\', '/')
            def mentionsCore = buildFile.text =~ /project\([\"']:?presentation-core[\"']\)/
            if (mentionsCore && path != "build.gradle" && !(path in ["ac/build.gradle", "presentation-core/build.gradle",
                                           "presentation-compiler/build.gradle"])) {
                violations << "${buildFile}: forbidden direct dependency on presentation-core (platform/base must use mcmod contract)"
            }
        }
        if (!(coreBuild =~ /project\("?:mcmod"?\)/)) violations << "presentation-core must depend on mcmod"
        if (mcmodBuild =~ /project\([\"']:?presentation-core[\"']\)/) violations << "mcmod must not depend on presentation-core"
        if (platformBuild =~ /presentationCoreProject|project\([\"']:?presentation-core[\"']\)/) violations << "platform target must not directly depend on presentation-core"
        if (!(platformBuild =~ /project\(mcmodProject\.path\)/)) violations << "minecraft/base platform target must explicitly depend on mcmod"
        if (!(platformBuild =~ /mcmodContract\s+rootProject\.project\(mcmodProject\.path\)/)) violations << "minecraft/base platform target must carry mcmod in its isolated contract configuration"
        if (!(platformBuild =~ /runtimeClassOutput\(mcmodProject\)/)) violations << "minecraft/base platform target must consume mcmod output"
        if (!(acBuild =~ /project\([\"']:?presentation-core[\"']\)/)) violations << "ac must depend on presentation-core"
        [file("platform-src")].findAll { it.directory }.each { File root ->
            fileTree(root) { include "**/*.clj" }.files.each { File source ->
                if (source.text.contains("cn.li.presentation.core")) violations << "${source}: platform source imports presentation-core"
            }
        }
        fileTree(file("presentation-core/src/main")) {
            include "**/*.clj"
            include "**/*.java"
        }.files.each { File source ->
            if (source.text =~ /cn\.li\.(mcbase|mc1201|mc1211|mc262|forge|fabric|neoforge)\./) {
                violations << "${source}: presentation-core must not import platform/base or version namespaces"
            }
        }
        if (!violations.isEmpty()) throw new GradleException(violations.join("\n"))
        logger.lifecycle("[verifyPresentationDependencyDirection] ok")
    }
}

tasks.register("verifyVfxDependencyDirection") {
    group = "verification"
    description = "Enforce the zero-platform-reference VFX dependency direction."
    doLast {
        def vfxBuild = file("vfx-core/build.gradle").text
        def mcmodBuild = file("mcmod/build.gradle").text
        def acBuild = file("ac/build.gradle").text
        def platformBuild = file("build-logic/platform-target.gradle").text
        def violations = []
        if (!(vfxBuild =~ /project\([\"']:?mcmod[\"']\)/)) {
            violations << "vfx-core must depend on mcmod"
        }
        if (vfxBuild =~ /project\([\"']:(?:ac|platform|presentation-core|presentation-compiler)[\"']\)/) {
            violations << "vfx-core must not depend on AC, platform or Presentation modules"
        }
        if (!(acBuild =~ /project\([\"']:?vfx-core[\"']\)/)) {
            violations << "AC must compose vfx-core"
        }
        if (platformBuild =~ /vfx-core|project\([\"']:?vfx-core[\"']\)/) {
            violations << "platform build logic must not mention vfx-core"
        }
        if (mcmodBuild =~ /cn\.li\.vfx\./) {
            violations << "mcmod must expose only the ABI and must not depend on vfx-core namespaces"
        }
        fileTree(file("mcmod/src/main")) {
            include "**/*.clj"
            include "**/*.cljc"
            include "**/*.java"
        }.files.each { File source ->
            if (source.text =~ /cn\.li\.vfx\./) {
                violations << "${source}: mcmod must not require vfx-core"
            }
        }
        fileTree(file("platform-src")) {
            include "**/*.clj"
            include "**/*.cljc"
            include "**/*.java"
        }.files.each { File source ->
            if (source.text =~ /cn\.li\.(?:vfx|ac\.vfx)\./) {
                violations << "${source}: platform source statically requires VFX/AC VFX"
            }
            def normalizedPath = source.path.replace('\\', '/')
            if (normalizedPath.endsWith('/mcbase/client/effects/hand.clj') &&
                source.text.contains('cn.li.platform.neutral.presentation')) {
                violations << "${source}: hand rendering must consume the VFX Frame ABI, not Presentation Host"
            }
            if (normalizedPath.contains('/platform-src/loader/') &&
                normalizedPath.endsWith('/client/fov_renderer.clj') &&
                source.text.contains('cn.li.platform.neutral.presentation')) {
                violations << "${source}: FOV rendering must consume the VFX Host ABI"
            }
        }
        fileTree(file("vfx-core/src/main")) {
            include "**/*.clj"
            include "**/*.cljc"
            include "**/*.java"
        }.files.each { File source ->
            if (source.text =~ /(?:net\.minecraft|net\.minecraftforge|net\.fabricmc|net\.neoforged|cn\.li\.(?:platform|mcbase|mc1201|mc1211|mc262|ac|presentation))\./) {
                violations << "${source}: vfx-core contains a platform/AC/Presentation reference"
            }
        }
        [file("ac/src/main/clojure"), file("platform-src")].findAll { it.directory }.each { File root ->
            fileTree(root) { include "**/*.clj"; include "**/*.cljc" }.files.each { File source ->
                if (source.text =~ /cn\.li\.ac\.ability\.client\.(?:level-effects|hand-effects)/) {
                    violations << "${source}: removed Level/Hand Effects namespace is still referenced"
                }
                if (source.text.contains("presentation-effects") || source.text.contains("render-profiles.effect-profiles")) {
                    violations << "${source}: removed AC Presentation Effect/render-profile module is still referenced"
                }
                if ((source.text.contains("defmulti") || source.text.contains("(defmethod")) && source.path.replace('\\','/') =~ /fx_templates\/arc_beam/) {
                    violations << "${source}: Arc-Beam must use explicit method registry, not defmulti/defmethod"
                }
            }
        }
        fileTree(file("platform-src")) {
            include "**/EffectRendererDispatcher.java"
            include "**/ScriptedEffectBillboardRenderer.java"
            include "**/ScriptedMarkerBillboardRenderer.java"
            include "**/ScriptedRayCompositeRenderer.java"
            include "**/TieredZigzagArcRenderer.java"
            include "**/*.clj"
            include "**/*.java"
        }.files.each { File source ->
            if (source.name in ["EffectRendererDispatcher.java", "ScriptedEffectBillboardRenderer.java",
                                "ScriptedMarkerBillboardRenderer.java", "ScriptedRayCompositeRenderer.java",
                                "TieredZigzagArcRenderer.java"]) {
                violations << "${source}: removed effect-specific VFX renderer remains"
            }
            if (source.text.contains("script-render-runtime")) {
                violations << "${source}: removed Script Render Runtime is still referenced"
            }
            if (source.text =~ /ScriptedEffectSpawner|spawn-local-scripted-effect|move-local-scripted-effect|remove-local-scripted-effect/) {
                violations << "${source}: removed client scripted-effect bridge remains"
            }
        }
        [file("ac/src/main"), file("mcmod/src/main"), file("platform-src")].findAll { it.directory }.each { File root ->
            fileTree(root) { include "**/*.clj"; include "**/*.cljc"; include "**/*.java" }.files.each { File source ->
                if (source.text =~ /presentation-(?:spawn|destroy|clear|tick)-effect/) {
                    violations << "${source}: legacy Presentation Effect bridge remains; use the VFX Frame ABI"
                }
            }
        }
        fileTree(file("ac/src/main/resources")) {
            include "**/*.fx.edn"
        }.files.each { File source ->
            violations << "${source}: legacy Presentation FX resource remains; register a Clojure VFX descriptor"
        }
        if (!violations.isEmpty()) {
            throw new GradleException("VFX dependency direction violations:\n" + violations.unique().join("\n"))
        }
        logger.lifecycle("[verifyVfxDependencyDirection] ok")
    }
}

tasks.register("verifyVfxAotBoundary") {
    group = "verification"
    description = "Verify source-first VFX packaging and the platform AOT exclusion boundary."
    dependsOn ":ac:assembleNeutralRuntimeSources"
    doLast {
        def violations = []
        def vfxBuild = file("vfx-core/build.gradle").text
        if (!(vfxBuild =~ /onlyIf\s*\{\s*rootProject\.ext\.fullAotEnabled\s*\}/)) {
            violations << "vfx-core compileClojure must remain disabled unless -PfullAot=true"
        }
        if (!rootProject.ext.fullAotEnabled) {
            def neutralVfxSource = file("build/neutral/ac/neutral-runtime-sources/cn/li/vfx/runtime.clj")
            if (!neutralVfxSource.file) {
                violations << "default neutral runtime must publish vfx-core source-first runtime.clj"
            }
            fileTree(file("build")) { include "**/*__init.class" }.files.each { File classFile ->
                def normalized = classFile.absolutePath.replace('\\', '/')
                if (!normalized.contains('/clojure/test/') &&
                    (normalized.contains('/cn/li/vfx/') || normalized.contains('/cn/li/ac/vfx/'))) {
                    violations << "default AOT output contains VFX namespace: ${classFile}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("VFX AOT boundary violations:\n" + violations.unique().join("\n"))
        }
        logger.lifecycle("[verifyVfxAotBoundary] ok (fullAot={})", rootProject.ext.fullAotEnabled)
    }
}

tasks.register("verifyCombatDependencyDirection") {
    group = "verification"
    description = "Enforce the neutral Combat Core dependency and namespace boundary."
    doLast {
        def combatBuild = file("combat-core/build.gradle").text
        def acBuild = file("ac/build.gradle").text
        def platformBuild = file("build-logic/platform-target.gradle").text
        def violations = []
        if (!(combatBuild =~ /project\([\"']:?mcmod[\"']\)/)) {
            violations << "combat-core must depend on mcmod"
        }
        if (combatBuild =~ /project\([\"']:(?:ac|platform|vfx-core|presentation-core)[\"']\)/) {
            violations << "combat-core must not depend on AC, platform, VFX or Presentation"
        }
        if (!(acBuild =~ /project\([\"']:?combat-core[\"']\)/)) {
            violations << "AC must compose combat-core"
        }
        if (platformBuild =~ /combat-core|project\([\"']:?combat-core[\"']\)/) {
            violations << "platform build logic must not mention combat-core"
        }
        fileTree(file("combat-core/src/main")) {
            include "**/*.clj"; include "**/*.cljc"; include "**/*.java"
        }.files.each { File source ->
            if (source.text =~ /cn\.li\.(?:ac|platform|mcbase|mc1201|mc1211|mc262|forge|fabric|neoforge|vfx|presentation)\./) {
                violations << "${source}: combat-core contains forbidden AC/platform/VFX/Presentation reference"
            }
        }
        fileTree(file("platform-src")) {
            include "**/*.clj"; include "**/*.cljc"; include "**/*.java"
        }.files.each { File source ->
            // Ignore explanatory comments; the dependency gate is about
            // executable namespace/import references, not historical prose.
            def sourceWithoutComments = source.text.replaceAll(/(?m);.*$/, "")
            if (sourceWithoutComments =~ /cn\.li\.combat\.|combat-core|combat\.runtime/) {
                violations << "${source}: platform source references combat-core"
            }
        }
        if (!violations.isEmpty()) throw new GradleException(violations.unique().join("\n"))
        logger.lifecycle("[verifyCombatDependencyDirection] ok")
    }
}

tasks.register("verifyPresentationContainsNoVfxRuntime") {
    group = "verification"
    description = "Ensure Presentation Core is limited to UI/HUD and does not own skill VFX runtime."
    doLast {
        def violations = []
        // Capability-based, not vocabulary-based: the old /:vfx/ pattern
        // forbade the literal keyword :vfx anywhere, including inside a
        // plain-English comment, and forced runtime.clj's host-stage to
        // compare against a stringified "VFX" rather than the real
        // HostKind/VFX enum constant to dodge its own gate (see Step 1).
        // What must actually never appear here is vfx-core's own instance
        // lifecycle vocabulary (its own runtime.clj keys/fns, see
        // vfx-core/.../runtime.clj) — not the word "vfx" as English text.
        def vfxRuntimeVocabulary = ~/spawn-effect!|tick-effects!|:instances\b|:event-seq\b|:tombstones\b|\bspawn!|\bdestroy!/
        fileTree(file("presentation-core/src/main")) {
            include "**/*.clj"; include "**/*.cljc"; include "**/*.java"
        }.files.each { File source ->
            if (source.name == "effects.clj" || source.text =~ vfxRuntimeVocabulary) {
                violations << "${source}: Presentation Core still contains skill VFX runtime"
            }
        }
        fileTree(file("presentation-compiler/src/main")) {
            include "**/*.clj"; include "**/*.cljc"; include "**/*.java"
        }.files.each { File source ->
            if (source.name == "fx.clj") violations << "${source}: Presentation FX compiler must be removed"
        }
        if (!violations.isEmpty()) throw new GradleException(violations.unique().join("\n"))
        logger.lifecycle("[verifyPresentationContainsNoVfxRuntime] ok")
    }
}

// Combat-specific gates are intentionally small, composable checks so CI can
// run one invariant without rebuilding every loader target.
