tasks.register("verifyCombatDependencyDirection") {
    group = "verification"
    description = "Enforce the neutral Combat Core dependency and namespace boundary. Combat Core depends on mcmod and node-core, emits only the neutral VFX Intent ABI, and has no dependency on VFX Core, AC, platform or Presentation. The per-.clj-file forbidden-namespace check is cn.li.combat.dependency-direction-test (dependsOn below): it reads each file's real ns :require/:import clauses instead of grepping raw file text."
    // Runtime tests for the removed sink design are intentionally not part of
    // the architecture gate; the final migration is compile/load verified.
    dependsOn ":combat-core:checkClojure"
    doLast {
        def combatBuild = file("combat-core/build.gradle").text
        def acBuild = file("ac/build.gradle").text
        def platformBuild = file("build-logic/platform-target.gradle").text
        def violations = []
        if (!(combatBuild =~ /project\([\"']:?mcmod[\"']\)/)) {
            violations << "combat-core must depend on mcmod"
        }
        if (combatBuild =~ /project\([\"']:?vfx-core[\"']\)/) {
            violations << "combat-core must not depend on vfx-core; it emits pure VfxIntent values"
        }
        if (combatBuild =~ /project\([\"']:(?:ac|platform|presentation-core)[\"']\)/) {
            violations << "combat-core must not depend on AC, platform or Presentation"
        }
        if (platformBuild =~ /combat-core|project\([\"']:?combat-core[\"']\)/) {
            violations << "platform build logic must not mention combat-core"
        }
        fileTree(file("combat-core/src/main")) {
            include "**/*.java"
        }.files.each { File source ->
            if (source.text =~ /cn\.li\.(?:ac|platform|mcbase|mc1201|mc1211|mc262|forge|fabric|neoforge|presentation)\./) {
                violations << "${source}: combat-core contains forbidden AC/platform/Presentation reference"
            }
        }
        fileTree(file("platform-src")) {
