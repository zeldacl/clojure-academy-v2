tasks.register("verifyClojureRuntimeRepresentation") {
    group = "verification"
    description = "Ensure target-derived AOT closures and source runtime namespaces are mutually exclusive."
    dependsOn ":platform:verifyNeutralClojurePackaging", ":platform:verifyPlatformAotCoverage"
    doLast {
        def catalog = new groovy.json.JsonSlurper().parse(file("platform-catalog.json"))
        def selectedTarget = (findProperty("platformTarget") ?: catalog.defaultTarget).toString()
        def runtimeRoot = file("platform/build/targets/${selectedTarget}/platform")
        def resourcesRoot = new File(runtimeRoot, "resources/main")
        def classesRoots = [new File(runtimeRoot, "classes/java/main"), new File(runtimeRoot, "clojure/main")]
        def sourceBases = [] as Set
        if (resourcesRoot.isDirectory()) {
            fileTree(resourcesRoot) {
                include "**/*.clj"
                include "**/*.cljc"
            }.files.each { File source ->
                sourceBases << resourcesRoot.toPath().relativize(source.toPath()).toString()
                    .replace("\\", "/").replaceFirst(/\.(clj|cljc)$/, "")
            }
        }
        def classBases = [] as Set
        classesRoots.findAll { it.isDirectory() }.each { File classesRoot ->
            fileTree(classesRoot) { include "**/*__init.class" }.files.each { File clazz ->
                classBases << classesRoot.toPath().relativize(clazz.toPath()).toString()
                    .replace("\\", "/").replaceFirst(/__init\.class$/, "")
            }
        }
        def overlap = sourceBases.intersect(classBases).sort()
        if (!overlap.isEmpty()) {
            throw new GradleException("Clojure runtime representation overlap in ${selectedTarget}: ${overlap}")
        }
        logger.lifecycle("[verifyClojureRuntimeRepresentation] ok (target AOT closure XOR source runtime)")
    }
}

