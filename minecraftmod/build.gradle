tasks.register("verifyEdnNoConfigBackReferences") {
    group = "verification"
    description = "Require migrated skill EDN to be config-independent declarations."
    doLast {
        def roots = [file("ac/src/main/resources/ac/combat/abilities"),
                     file("ac/src/main/resources/ac/vfx/effects")]
        def violations = []
        roots.each { root ->
            fileTree(root).matching { include "*.edn" }.files.each { source ->
                def body = source.text
                if (body =~ /:source\s+:config|:path\s+\[:(?:railgun|arc-gen|thunder-clap)\b/) {
                    violations << source
