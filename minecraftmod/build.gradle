    doLast {
        def violations = []
        fileTree(file("combat-core/src/main")) {
            include "**/*.clj"; include "**/*.cljc"
        }.files.each { File source ->
            if (source.text =~ /requiring-resolve|load-string|eval\s*\(/) {
