    group = "verification"
    dependsOn "verifyCombatDependencyDirection"
    doLast {
        def javaFiles = fileTree(file("combat-core/src/main/java")) { include "**/*.java" }.files
        if (!javaFiles.isEmpty()) throw new GradleException("combat-core must not contain Java combat implementation")
        logger.lifecycle("[verifyCombatClojureOwnership] ok")
    }
}
tasks.register("verifyCombatNoPlatformNamespaces") {
    group = "verification"
    // Intentionally a thin named checkpoint, not a second copy of the check:
    // verifyCombatDependencyDirection (see above) already scans
    // combat-core/src/main for cn.li.(ac|platform|mc*|forge|fabric|
    // neoforge|vfx|presentation). namespace references as part of its own
    // doLast — duplicating that regex here would just be a second copy that
    // could silently drift out of sync with the first. dependsOn makes this
    // task name a meaningful, separately-runnable CI target for that same
    // invariant instead of a no-op that only prints "ok".
    dependsOn "verifyCombatDependencyDirection"
    doLast { logger.lifecycle("[verifyCombatNoPlatformNamespaces] ok (enforced by verifyCombatDependencyDirection)") }
}
tasks.register("verifyCombatNoPrivateRuntime") {
