if (rootProject.ext.fullAotEnabled) {
    tasks.named("verifyNeutralSourceAotXor").configure {
        dependsOn rootProject.ext.neutralSourceFirstProjects.collect { projectPath ->
            project(projectPath).tasks.named("classes")
        }
    }
}

