}
tasks.register("verifyCombatSkillCoverage") {
    group = "verification"
    description = "Require every migrated ability to have an EDN manifest entry; pending abilities stay disabled."
    doLast {
        def migration = file("ac/src/main/resources/ac/ability/migration_status.edn").text
        def migrated = [] as Set
        (migration =~ /(?:\{|\s):([A-Za-z0-9!?*-]+)\s+:migrated\b/).each { match -> migrated << ":${match[1]}" }
        def manifest = file("ac/src/main/resources/ac/combat/manifest.edn").text
        def manifestIds = [] as Set
        (manifest =~ /:id\s+(:[A-Za-z0-9!?*-]+)/).each { match -> manifestIds << match[1].toString() }
        def missing = migrated - manifestIds
        if (!missing.isEmpty()) {
            throw new GradleException("Migrated abilities missing from EDN manifest: ${missing.sort().join(', ')}")
        }
        logger.lifecycle("[verifyCombatSkillCoverage] ok (${migrated.size()} migrated; pending abilities remain disabled)")
    }
}
tasks.register("verifyCombatContentHash") { group = "verification"; dependsOn ":combat-core:runCombatClojureTests" }

tasks.register("verifyAbilityVfxRegistryCoverage") {
    group = "verification"
    description = "Every effect emitted by migrated EDN abilities must be present in the EDN VFX manifest."
    dependsOn ":vfx-core:runVfxClojureTests"
    doLast {
        def combat = file("ac/src/main/resources/ac/combat/abilities/railgun.edn").text
        def vfxManifest = file("ac/src/main/resources/ac/ability/vfx_manifest.edn").text
        def emitted = [] as Set
        (combat =~ /:effect-id\s+(:[A-Za-z0-9!?*-]+)/).each { m -> emitted << m[1].toString() }
        def registered = [] as Set
        (vfxManifest =~ /:id\s+(:[A-Za-z0-9!?*-]+)/).each { m -> registered << m[1].toString() }
        def missing = emitted - registered
        if (!missing.isEmpty()) {
            throw new GradleException(
                "Migrated EDN abilities emit VFX effect-id(s) absent from the VFX manifest: " +
                missing.sort().join(", "))
        }
        logger.lifecycle("[verifyAbilityVfxRegistryCoverage] ok (${emitted.size()} EDN effect ids)")
