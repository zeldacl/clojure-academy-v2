plugins {
    id "java-library"
    id "dev.clojurephant.clojure"
}

// node-core is the node-language kernel shared by combat-core and vfx-core:
// immutable descriptor environment, expression evaluator, lexical-scope checker,
// composite expansion, structural validation, schema export. It must not
// depend on Minecraft, mcmod, or either domain module -- see
// verifyNodeCoreDependencyDirection in the root build.gradle and
// NODE_LANGUAGE.md section 2.1. This is the one Clojure module in the repo
// that deliberately has ZERO project dependencies of its own.
layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("neutral/${project.name}"))

tasks.matching { it.name == "compileClojure" || it.name == "compileTestClojure" }.configureEach {
    forkOptions.jvmArgs += ["-Dclojure.compile.warn-on-reflection=true"]
}

tasks.named("processResources").configure {
    from(sourceSets.main.clojure.srcDirs) {
        include "**/*.clj", "**/*.cljc"
    }
}

tasks.named("compileClojure").configure { task ->
    onlyIf { false }
    def targetDir = layout.buildDirectory.dir("clojure/main")
    if (task.metaClass.hasProperty(task, "destinationDirectory")) {
        task.destinationDirectory = targetDir
    } else {
        task.destinationDir = targetDir.get().asFile
    }
}

def clearNeutralAotOutput = tasks.register("clearNeutralAotOutput") {
    onlyIf { true }
    doLast { delete(layout.buildDirectory.dir("clojure/main").get().asFile) }
}
tasks.named("classes").configure { dependsOn clearNeutralAotOutput }
tasks.named("jar").configure { dependsOn clearNeutralAotOutput }

tasks.register("runNodeCoreClojureTests", JavaExec) {
    group = "verification"
    dependsOn "compileTestClojure", "classes"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "clojure.main"
    if (System.getProperty("node-core.test.only") != null) {
        systemProperty "node-core.test.only", System.getProperty("node-core.test.only")
    }
    args "-m", "cn.li.node.test-runner"
}

tasks.named("test").configure {
    dependsOn "runNodeCoreClojureTests"
    actions.clear()
    doLast { /* runNodeCoreClojureTests already executed the suite */ }
}

tasks.register("verifyPaletteMetadataNodeCore", JavaExec) {
    group = "verification"
    description = "Node-editor plan Phase 0 gate, node-core half: runs only cn.li.node.vocab-export-test (every exported op has a real :category, resolvable :i18n key, no :uncategorized) -- a fast, focused check, not the full suite. See root verifyVocabularyPaletteMetadata, which chains this with the combat-core/vfx-core/ac halves of the same assertion."
    dependsOn "compileTestClojure", "classes"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "clojure.main"
    systemProperty "node-core.test.only", "cn.li.node.vocab-export-test"
    args "-m", "cn.li.node.test-runner"
}

// cn.li.test-support.pure-auto-test-runner has no mcmod dependency (unlike
// cn.li.test-support.auto-test-runner, ac/mcmod's Framework-fixture-wrapped
// equivalent) -- node-core must never depend on mcmod, even in test scope.
// Lives in its own directory precisely so this addition cannot also pull in
// the mcmod- and Minecraft-coupled files that sit alongside the impure
// runner elsewhere under platform-src/test-support.
sourceSets.test.clojure.srcDir rootProject.file('platform-src/test-support/src/pure/clojure')

dependencies {
    implementation "org.clojure:clojure:${rootProject.ext.clojureVersions.clojure}"
    testImplementation "org.clojure:test.check:${rootProject.ext.clojureVersions.testCheck}"
}
