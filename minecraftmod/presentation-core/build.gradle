plugins {
    id "java-library"
    id "dev.clojurephant.clojure"
}

tasks.withType(dev.clojurephant.plugin.clojure.tasks.ClojureCheck).configureEach {
    dependsOn ":mcmod:classes"
}
tasks.matching { it.name == "compileClojure" || it.name == "compileTestClojure" }.configureEach {
    dependsOn ":mcmod:runtimeClasses"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    dependsOn ":mcmod:compileClojure"
    options.release = 17
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.register("runCoreClojureTests", JavaExec) {
    group = "verification"
    description = "Run Presentation core Clojure runtime tests."
    dependsOn tasks.named("compileTestClojure"), tasks.named("compileClojure"), tasks.named("classes")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "clojure.main"
    args "-m", "cn.li.presentation.core.test-runner"
}

// cn.li.test-support.pure-auto-test-runner has no mcmod.framework dependency
// (unlike ac/mcmod's Framework-fixture-wrapped equivalent) -- presentation-
// core's tests have no global registry state that fixture exists to isolate.
sourceSets.test.clojure.srcDir rootProject.file('platform-src/test-support/src/pure/clojure')

// P7: presentation-core has its own local copy of node-core's dep-check
// helper (cn.li.presentation.core.dep-check) rather than pulling in
// node-core/src/test/clojure the way combat-core/vfx-core do -- those two
// already depend on node-core's main classes for real, so the rest of
// that directory's test files (which need them) compile fine as
// collateral; presentation-core deliberately has zero node-core
// dependency, and this test exists to prove exactly that, so reaching
// into node-core's classpath just to satisfy unrelated pulled-in files
// would undermine the thing being tested.

// Core behavior remains Minecraft-free. The only shared compile contract is
// mcmod's version-neutral domain/data bridge; no loader dependency is allowed.
// api (not implementation): the frame ABI (RenderCommand/RenderStage/
// RenderPass/FramePacket) now lives in mcmod and is part of Core's own
// public surface (PresentationRuntime/RenderBackend), so it must propagate
// to presentation-compiler, which constructs RenderCommand records directly.
dependencies {
    api project(":mcmod")
    implementation "org.clojure:clojure:${rootProject.ext.clojureVersions.clojure}"
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}
