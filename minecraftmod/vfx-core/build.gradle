plugins {
    id "java-library"
    id "dev.clojurephant.clojure"
}

// VFX is a neutral, source-first Clojure runtime. It must not be AOTed in a
// normal platform build because it contains no Minecraft symbols to remap.
layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("neutral/${project.name}"))

tasks.withType(dev.clojurephant.plugin.clojure.tasks.ClojureCheck).configureEach { checkTask ->
    checkTask.internalOutputFile.set(layout.buildDirectory.file("tmp/${checkTask.name}/internal.txt"))
    checkTask.dependsOn ":mcmod:classes", ":node-core:classes"
    // VFX owns its visual vocabulary while sharing node-core's immutable
    // descriptor/environment and expression-kernel contracts with Combat.
    // node-core is source-first; its .clj sources land only in its own
    // resources/main dir, which the standard project(":node-core")
    // compileClasspath resolution does not surface here. Same fix
    // combat-core/build.gradle applies, for the same underlying reason --
    // now load-bearing rather than latent, since effect_schema.clj requires
    // cn.li.node.digest.
    checkTask.classpath.from(files(rootProject.layout.buildDirectory.dir("neutral/node-core/resources/main")))
    checkTask.classpath.from(files(rootProject.layout.buildDirectory.dir("neutral/node-core/clojure/main")))
}

tasks.matching { it.name == "compileClojure" || it.name == "compileTestClojure" }.configureEach {
    forkOptions.jvmArgs += ["-Dclojure.compile.warn-on-reflection=true"]
}

// node-core is source-first; its .clj sources land only in its own
// resources/main dir, which the standard project(":node-core")
// compileClasspath resolution does not surface here. Same fix
// combat-core/build.gradle applies, for the same underlying reason -- this
// block was previously an empty stub pointing at that comment without
// actually doing what it described.
tasks.named("compileTestClojure").configure {
    dependsOn ":node-core:classes"
    classpath.from(files(rootProject.layout.buildDirectory.dir("neutral/node-core/resources/main")))
    classpath.from(files(rootProject.layout.buildDirectory.dir("neutral/node-core/clojure/main")))
}

// cn.li.node.dep-check is node-core's shared dependency-direction checker;
// see the matching comment in combat-core/build.gradle for why the whole
// directory (not just dep_check.clj) is added.
sourceSets.test.clojure.srcDir rootProject.file('node-core/src/test/clojure')
// node-core's own test_runner.clj (pulled in by the srcDir addition above)
// requires this; without it, compileTestClojure fails to resolve it even
// though cn.li.vfx.test-runner never calls it.
sourceSets.test.clojure.srcDir rootProject.file('platform-src/test-support/src/pure/clojure')

tasks.named("processResources").configure {
    from(sourceSets.main.clojure.srcDirs) {
        include "**/*.clj", "**/*.cljc"
    }
}

tasks.named("compileClojure").configure { task ->
    onlyIf { false }
    dependsOn ":mcmod:compileClojure"
    def targetDir = layout.buildDirectory.dir("clojure/main")
    if (task.metaClass.hasProperty(task, "destinationDirectory")) {
        task.destinationDirectory = targetDir
    } else {
        task.destinationDir = targetDir.get().asFile
    }
}

// A source-first neutral module must not retain classes produced by an
// a prior remapped build. Clearing the module-local output on
// every normal classes/jar invocation makes the source XOR AOT boundary
// deterministic even when developers switch build modes in one checkout.
def clearNeutralAotOutput = tasks.register("clearNeutralAotOutput") {
    onlyIf { true }
    doLast {
        delete(layout.buildDirectory.dir("clojure/main").get().asFile)
    }
}
tasks.named("classes").configure { dependsOn clearNeutralAotOutput }
tasks.named("jar").configure { dependsOn clearNeutralAotOutput }

tasks.register("runVfxClojureTests", JavaExec) {
    group = "verification"
    dependsOn "compileTestClojure", "classes"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "clojure.main"
    args "-m", "cn.li.vfx.test-runner"
}

tasks.register("verifyPaletteMetadataVfxCore", JavaExec) {
    group = "verification"
    description = "Node-editor plan Phase 0 gate, vfx-core half: runs only cn.li.vfx.dsl-vocabulary-test (every scene node has a real :category and :i18n key). See root verifyVocabularyPaletteMetadata."
    dependsOn "compileTestClojure", "classes"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "clojure.main"
    systemProperty "vfx-core.test.only", "cn.li.vfx.dsl-vocabulary-test"
    args "-m", "cn.li.vfx.test-runner"
}

dependencies {
    implementation project(":mcmod")
    // Shared immutable node environment/descriptor contracts. VFX owns its
    // visual reducers, but uses the same language kernel as Combat.
    implementation project(":node-core")
    implementation "org.clojure:clojure:${rootProject.ext.clojureVersions.clojure}"
    testImplementation "org.clojure:test.check:${rootProject.ext.clojureVersions.testCheck}"
}
