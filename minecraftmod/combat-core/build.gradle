plugins {
    id "java-library"
    id "dev.clojurephant.clojure"
}

// Combat Core is neutral, source-first Clojure.  It is deliberately kept
// separate from AC content and from every Minecraft/loader target.
layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("neutral/${project.name}"))

tasks.withType(dev.clojurephant.plugin.clojure.tasks.ClojureCheck).configureEach { checkTask ->
    checkTask.internalOutputFile.set(layout.buildDirectory.file("tmp/${checkTask.name}/internal.txt"))
    checkTask.dependsOn ":mcmod:classes", ":node-core:classes"
    // node-core is source-first; any target AOT is derived from the platform closure.
    // its .clj sources land only in its own resources/main dir, which the
    // standard project(":node-core") compileClasspath resolution does not
    // surface here (Java's compile-classpath convention excludes a
    // dependency's resources -- irrelevant for javac, but Clojure's
    // ClojureCheck genuinely needs the .clj source text to require the
    // namespace). Same fix mcmod already applies to its own Java output
    // (see mcmod/build.gradle) for the same underlying reason.
    checkTask.classpath.from(files(rootProject.layout.buildDirectory.dir("neutral/node-core/resources/main")))
    checkTask.classpath.from(files(rootProject.layout.buildDirectory.dir("neutral/node-core/clojure/main")))
}

tasks.matching { it.name == "compileClojure" || it.name == "compileTestClojure" }.configureEach {
    forkOptions.jvmArgs += ["-Dclojure.compile.warn-on-reflection=true"]
}

// compileTestClojure hits the same node-core resources-not-on-compileClasspath
// gap as checkClojure above (it always runs, source-first or not, since test
// namespaces are compiled to real classes either way).
tasks.named("compileTestClojure").configure {
    dependsOn ":node-core:classes"
    classpath.from(files(rootProject.layout.buildDirectory.dir("neutral/node-core/resources/main")))
    classpath.from(files(rootProject.layout.buildDirectory.dir("neutral/node-core/clojure/main")))
}

// cn.li.node.dep-check is node-core's shared dependency-direction checker,
// reused here instead of a second copy of the same reader/violation logic.
// Adding node-core's whole test dir (not just dep_check.clj) mirrors the
// existing platform-src/test-support srcDir pattern used by ac/mcmod: each
// consumer independently compiles the shared source into its own build
// output, so node-core's own *_test.clj files get compiled here too but are
// never required by cn.li.combat.test-runner, which only names combat-core's
// own test namespaces.
sourceSets.test.clojure.srcDir rootProject.file('node-core/src/test/clojure')

tasks.named("processResources").configure {
    from(sourceSets.main.clojure.srcDirs) {
        include "**/*.clj", "**/*.cljc"
    }
}

tasks.named("compileClojure").configure { task ->
    onlyIf { false }
    dependsOn ":mcmod:compileClojure", ":node-core:compileClojure"
    def targetDir = layout.buildDirectory.dir("clojure/main")
    if (task.metaClass.hasProperty(task, "destinationDirectory")) {
        task.destinationDirectory = targetDir
    } else {
        task.destinationDir = targetDir.get().asFile
    }
}

def clearNeutralAotOutput = tasks.register("clearNeutralAotOutput") {
    onlyIf { true }
    doLast { delete(layout.buildDirectory.dir("clojure/main").get().asFile) }
}
tasks.named("classes").configure { dependsOn clearNeutralAotOutput }
tasks.named("jar").configure { dependsOn clearNeutralAotOutput }

tasks.register("runCombatClojureTests", JavaExec) {
    group = "verification"
    dependsOn "compileTestClojure", "classes"
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "clojure.main"
    args "-m", "cn.li.combat.test-runner"
}

dependencies {
    implementation project(":mcmod")
    // Shared node-language kernel (immutable descriptor environment,
    // expression evaluator, scope checker, composite expansion) -- see
    // verifyNodeCoreDependencyDirection and NODE_LANGUAGE.md section 2.1.
    // combat-core's own vocabulary (components.clj) is folded into an
    // environment by the composition root.
    implementation project(":node-core")
    // Combat emits only the transport-level VFX intent ABI (effect id,
    // audience and payload). AC/ability-runtime composes the VFX catalog and
    // mcmod routes packets; Combat Core has no vfx-core dependency.
    implementation "org.clojure:clojure:${rootProject.ext.clojureVersions.clojure}"
    testImplementation "org.clojure:test.check:${rootProject.ext.clojureVersions.testCheck}"
}
