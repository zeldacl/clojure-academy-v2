pluginManagement {
    def catalogFile = new File(settings.rootDir, "platform-catalog.json")
    def catalog = new groovy.json.JsonSlurper().parse(catalogFile)
    def targetId = (settings.startParameter.projectProperties["platformTarget"] ?: catalog.defaultTarget).toString()
    def target = catalog.targets[targetId]
    if (target == null) {
        throw new GradleException(
            "Unknown platformTarget '${targetId}'. Known targets: ${catalog.targets.keySet().sort()}")
    }
    def profileId = target.buildProfile?.toString()
    def profile = catalog.buildProfiles[profileId]
    if (profile == null) {
        throw new GradleException(
            "Target '${targetId}' references unknown buildProfile '${profileId}'. Known: ${catalog.buildProfiles.keySet().sort()}")
    }
    def toolchain = (profile.toolchain ?: "loom").toString()
    if (!(toolchain in ["loom", "mdg"])) {
        throw new GradleException("buildProfile '${profileId}' toolchain must be 'loom' or 'mdg', got '${toolchain}'")
    }
    if (toolchain == "loom" && !profile.loomVersion) {
        throw new GradleException("buildProfile '${profileId}' with toolchain=loom must declare loomVersion")
    }
    if (toolchain == "mdg" && !profile.modDevGradleVersion) {
        throw new GradleException("buildProfile '${profileId}' with toolchain=mdg must declare modDevGradleVersion")
    }
    if (!profile.clojurephantVersion) {
        throw new GradleException("buildProfile '${profileId}' must declare clojurephantVersion")
    }
    if (!profile.shadowVersion || !profile.shadowPluginId) {
        throw new GradleException("buildProfile '${profileId}' must declare shadowPluginId and shadowVersion")
    }
    // Register BOTH toolchains (no capability conflict) so root can apply-false both.
    // Register ONLY the selected target's shadow plugin (johnrengelman vs gradleup conflict).
    def loomVersion = catalog.buildProfiles.values()
        .findAll { (it.toolchain ?: "loom").toString() == "loom" && it.loomVersion }
        .collect { it.loomVersion.toString() }
        .unique()
    def mdgVersion = catalog.buildProfiles.values()
        .findAll { it.toolchain?.toString() == "mdg" && it.modDevGradleVersion }
        .collect { it.modDevGradleVersion.toString() }
        .unique()
    if (loomVersion.size() > 1) {
        throw new GradleException("Multiple loom versions in catalog: ${loomVersion}")
    }
    if (mdgVersion.size() > 1) {
        throw new GradleException("Multiple modDevGradle versions in catalog: ${mdgVersion}")
    }
    repositories {
        maven { url "https://maven.architectury.dev" }
        maven { url "https://maven.fabricmc.net" }
        maven { url "https://maven.minecraftforge.net" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
        mavenCentral()
        maven {
            url = "https://maven.blamejared.com"
            name = "BlameJared Maven"
        }
    }
    plugins {
        if (loomVersion) {
            id "dev.architectury.loom" version "${loomVersion.first()}"
        }
        if (mdgVersion) {
            id "net.neoforged.moddev" version "${mdgVersion.first()}"
        }
        id "dev.clojurephant.clojure" version "${profile.clojurephantVersion}"
        id "${profile.shadowPluginId}" version "${profile.shadowVersion}"
    }
}

rootProject.name = "clojure-minecraft-mod"

include "api"
include "mcmod"
include "ac"
include "platform"
include "tools:target-launcher"
